name: Generate Release Keystore (jalankan sekali saja)

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Pastikan 3 secret sudah terisi (berhenti kalau masih kosong)
        run: |
          set -e
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "FATAL: Salah satu dari secret KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD masih kosong."
            echo "Isi dulu ke-3 secret itu di Settings > Secrets and variables > Actions,"
            echo "BARU jalankan workflow ini. Kalau keystore sudah pernah dibuat dengan"
            echo "secret kosong sebelumnya, keystore itu TIDAK akan cocok dengan password baru."
            exit 1
          fi
          # Keystore modern berformat PKCS12: keytool MENGABAIKAN -keypass yang beda dari
          # -storepass, sehingga build release nanti gagal "Cannot recover key".
          # Makanya kedua password wajib sama -- cek di sini biar gagalnya cepat & jelas.
          if [ "$KEYSTORE_PASSWORD" != "$KEY_PASSWORD" ]; then
            echo "FATAL: KEY_PASSWORD harus SAMA PERSIS dengan KEYSTORE_PASSWORD (aturan format PKCS12)."
            exit 1
          fi
          echo "OK: ke-3 secret sudah terisi & konsisten, lanjut generate keystore."

      - name: Buat keystore baru
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Guitar Witer, OU=Personal, O=Personal, L=Unknown, S=Unknown, C=ID"

      - name: Ubah keystore ke teks base64
        run: base64 -w 0 release.keystore > release.keystore.base64.txt

      - name: Unggah keystore & versi base64-nya sebagai artifact
        uses: actions/upload-artifact@v6
        with:
          name: keystore-files
          # Di repo PUBLIC, artifact bisa diunduh siapa pun yang login GitHub.
          # Simpan 1 hari saja -> unduh, salin ke secret KEYSTORE_BASE64, lalu HAPUS artifact-nya.
          retention-days: 1
          path: |
            release.keystore
            release.keystore.base64.txt
