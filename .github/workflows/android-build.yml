name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # WAJIB -- tanpa ini, step "Buat Release" di bawah akan gagal (403)
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout kode
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependency npm
        run: npm install

      - name: Cek isi folder www/ sebelum lanjut
        run: |
          set -e
          echo "Isi folder www/:"
          ls -la www/ || (echo "FATAL: folder www/ tidak ditemukan di root repo" && exit 1)
          test -f www/index.html || (echo "FATAL: www/index.html tidak ada" && exit 1)
          echo "OK: www/ lengkap"

      - name: Buat folder android/ (verbose, berhenti kalau gagal)
        run: |
          set -e -x
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Folder android/ sudah ada, lewati."
          fi

      - name: Sync isi www/ ke android/ (verbose, berhenti kalau gagal)
        run: |
          set -e -x
          npx cap sync android

      - name: WAJIB - pastikan android/app/build.gradle benar-benar ada
        run: |
          set -e
          if [ ! -f "android/app/build.gradle" ]; then
            echo "FATAL: android/app/build.gradle tidak ditemukan setelah cap add + cap sync."
            echo "Menampilkan seluruh struktur folder android/ untuk diagnosa:"
            find android -maxdepth 5 2>/dev/null || echo "Folder android/ bahkan tidak ada sama sekali."
            exit 1
          fi
          echo "OK: android/app/build.gradle ditemukan."

      - name: Tempel HtmlKeyboardService.java ke lokasi paket Java
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/keyboardkustom/app
          cp native-patches/HtmlKeyboardService.java android/app/src/main/java/com/keyboardkustom/app/HtmlKeyboardService.java

      - name: Tempel NativeMicPitchDetector.java (deteksi nada native, ganti getUserMedia)
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/keyboardkustom/app
          cp native-patches/NativeMicPitchDetector.java android/app/src/main/java/com/keyboardkustom/app/NativeMicPitchDetector.java

      - name: Tempel MainActivity.java (versi yang minta izin mikrofon)
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/keyboardkustom/app
          cp native-patches/MainActivity.java android/app/src/main/java/com/keyboardkustom/app/MainActivity.java

      - name: Tempel method.xml ke folder res/xml
        run: |
          set -e
          mkdir -p android/app/src/main/res/xml
          cp native-patches/method.xml android/app/src/main/res/xml/method.xml

      - name: Pasang ikon launcher foto pribadi (mipmap + adaptive icon)
        run: python3 native-patches/insert_icon.py android/app/src/main/res native-patches/app-icon

      - name: Daftarkan service keyboard di AndroidManifest.xml
        run: python3 native-patches/insert_service.py android/app/src/main/AndroidManifest.xml

      - name: Tambahkan izin RECORD_AUDIO di AndroidManifest.xml
        run: python3 native-patches/insert_permission.py android/app/src/main/AndroidManifest.xml

      - name: Tambahkan dependency androidx.webkit (untuk WebViewAssetLoader/mikrofon)
        run: python3 native-patches/insert_webkit_dependency.py android/app/build.gradle

      - name: Decode keystore dari secret (kalau ada)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore || (echo "FATAL: release.keystore kosong/gagal decode" && exit 1)

      - name: Tambahkan signing config ke build.gradle (kalau keystore tersedia)
        if: env.KEYSTORE_BASE64 != ''
        run: python3 native-patches/insert_signing.py android/app/build.gradle

      - name: Beri izin eksekusi gradlew
        run: chmod +x android/gradlew

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Unggah APK debug sebagai artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Build APK release (signed)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Unggah APK release sebagai artifact (kalau ada)
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v6
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # ---- Bagian ini yang bikin APK-nya nongol di tab "Releases" depan repo,
      # bukan cuma terkubur di tab Actions -> buka run -> scroll ke Artifacts.
      # Tag dibuat unik per run (build-<nomor_run>) supaya tiap push ke main
      # otomatis jadi Release baru, tidak menimpa yang lama.
      - name: Buat GitHub Release & lampirkan APK
        if: success()   # jangan bikin Release kosong kalau build gagal
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          body: |
            Build otomatis dari commit ${{ github.sha }}.
            - `app-debug.apk` selalu ada (tidak perlu keystore).
            - `app-release.apk` cuma ada kalau secret KEYSTORE_BASE64 dkk sudah diisi.
          # fail_on_unmatched_files:false -> kalau release.apk belum ada (keystore
          # belum disetel), step ini tetap sukses & cuma lampirin yang ada saja.
          fail_on_unmatched_files: false
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
