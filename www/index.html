<style>
  :root{
    /* ---- Palet Gboard (tema gelap bawaan), diukur langsung dari rekaman layar Gboard ---- */
    --app-bg:#F1F3F4;
    --frame:#1F2023;
    --screen:#FFFFFF;
    --field-bg:#FFFFFF;
    --field-border:#DADCE0;
    --kb-bg:#223134;
    --key-bg:#3D494D;
    --key-fn-bg:#2F3B3F;
    --key-text:#FDFFFC;
    --key-tag:#6BABA4;
    --shadow:rgba(0,0,0,.45);
    --accent:#6BABA4;
    --accent-dim:#E8F0FE;
    --danger:#D93025;
    --muted:#8E9A9C;
    --key-shift-on-bg:#4A6266;
    --key-capslock-bg:#6BABA4;
    --key-active-bg:#566468;
    --key-fn-active-bg:#414F53;
    --key-bubble-bg:#4A585C;
    --key-bubble-text:#FDFFFC;
    --key-enter-bg:#6BABA4;
    --bar-icon:#C4C9C8;
    --bar-icon-dim:#5B686B;
    --divider:#3D494D;
    --pill-bg:#33444A;
    /* ---- Rasio ukuran huruf tuts, bisa diubah 0.85–2.0 lewat Setelan (85%–200%), persis fitur Gboard terbaru ---- */
    --key-font-scale:1;
    /* ---- Geometri Gboard (diukur dari layar 360dp): tuts persegi membulat 8dp, tinggi 39dp,
       jarak antar tuts 4.75dp, margin kiri-kanan 13.5dp ---- */
    --key-radius:8px;
    --key-h:39px;
    --kgap:4.75px;
    --key-border:none;
  }
  /* ---- Tema alternatif ala Gboard: tinggal ganti class di <body> ---- */
  body.theme-light{
    --kb-bg:#E8EAED; --key-bg:#FFFFFF; --key-fn-bg:#DADCE0; --key-text:#202124;
    --key-tag:#1A73E8; --key-active-bg:#C2E7FF; --key-fn-active-bg:#BDC1C6;
    --key-bubble-bg:#202124; --key-bubble-text:#FFFFFF; --key-enter-bg:#1A73E8;
    --bar-icon:#5F6368; --bar-icon-dim:#BDC1C6; --divider:#C4C7C5; --pill-bg:#FFFFFF; --muted:#5F6368;
  }
  body.theme-blue{
    --kb-bg:#0B2545; --key-bg:#13315C; --key-fn-bg:#0E223F; --key-text:#E8F0FE;
    --key-tag:#8AB4F8; --key-active-bg:#1A4A8A; --key-fn-active-bg:#1A4A8A;
    --key-bubble-bg:#08182E; --key-bubble-text:#FFFFFF; --key-enter-bg:#4C8DFF;
    --bar-icon:#AFC4E8; --bar-icon-dim:#4B6494; --divider:#1F3F6E; --pill-bg:#1A3C70;
  }
  body.theme-purple{
    --kb-bg:#241B2F; --key-bg:#3A2C4A; --key-fn-bg:#2B2038; --key-text:#F1E8FA;
    --key-tag:#D9B3FF; --key-active-bg:#5B3E75; --key-fn-active-bg:#4A3560;
    --key-bubble-bg:#1A1220; --key-bubble-text:#FFFFFF; --key-enter-bg:#B388FF;
    --bar-icon:#CDB8E6; --bar-icon-dim:#6E5A86; --divider:#4F3D63; --pill-bg:#45355A;
  }
  body.theme-green{
    --kb-bg:#0F2A1E; --key-bg:#17402C; --key-fn-bg:#0F2A1E; --key-text:#E4F5EA;
    --key-tag:#7CE7C4; --key-active-bg:#1F6B47; --key-fn-active-bg:#1B5A3D;
    --key-bubble-bg:#081A11; --key-bubble-text:#FFFFFF; --key-enter-bg:#2ECC8F;
    --bar-icon:#B5DCC5; --bar-icon-dim:#4F7A62; --divider:#245C40; --pill-bg:#1C4D36;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  html{ touch-action: manipulation; overscroll-behavior: none; }
  body{
    margin:0;
    min-height:100dvh;
    background:var(--kb-bg);
    font-family:Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color:var(--key-text);
    overflow-x:hidden;
    overflow-y:hidden;
    overscroll-behavior:none;
    /* Cegah pull-to-refresh / swipe layar ikut "narik" halaman saat jari geser
       cepat antar tuts -- ini yang bikin ketikan cepat kadang kerasa "goyang"
       atau ke-skip di keyboard berbasis WebView biasa. */
    touch-action: manipulation;
  }

  /* Halaman ini murni tampilan keyboard saja (tanpa contoh kotak teks /
     judul aplikasi) — dibuat supaya saat dimuat sebagai keyboard sungguhan
     lewat HtmlKeyboardService.java, yang tampil cuma keyboard-nya, mengisi
     penuh area yang diberikan Android untuk keyboard. */
  .kb-float-wrap{
    position:relative;
    width:100%;
    max-width:480px;
    margin:0 auto;
    background:var(--kb-bg);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }

  /* BARU -- fix "tampilan bertumpuk, tidak ringkas": dulu baris ikon fitur
     (.gboard-toolbar) dan baris saran kata (.suggest-bar) adalah DUA baris
     terpisah yang SELALU tampil bareng-bareng, ditumpuk vertikal -- jadi
     total tinggi keyboard = tinggi toolbar + tinggi suggest-bar SEKALIGUS,
     padahal isinya jarang perlu dilihat bersamaan. Gboard asli cuma pakai
     SATU baris: defaultnya nampilin saran kata, dan ada satu tombol kecil
     buat "buka" baris ikon fitur menggantikan saran kata sementara (gantian,
     bukan nambah). Sekarang .feature-bar ini yang jadi slot tunggal itu --
     tingginya TETAP (dikunci JS lewat --toolbar-h, sama seperti dulu), dan
     .gboard-toolbar / .suggest-bar jadi ANAK yang mengisi 100% slot itu,
     cuma satu yang display:flex di satu waktu (lihat toggleFeatureBar() JS).
  */
  .feature-bar{
    display:flex; align-items:stretch;
    height:var(--toolbar-h, 44px);
    min-height:var(--toolbar-h, 44px);
    max-height:var(--toolbar-h, 44px);
    padding:0 6px 0 0;
  }
  .bar-center{ position:relative; flex:1 1 auto; min-width:0; display:flex; }
  /* Tombol samping bar (kiri: grid/X, kanan: mic). Area sentuh 44dp, gambar lebih kecil. */
  .gb-side{
    flex:0 0 auto; align-self:center; width:44px; height:44px; border:none; padding:0;
    background:none; color:var(--bar-icon); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .gb-side svg{ width:20px; height:20px; fill:currentColor; }
  .gb-left{ width:40px; }
  .gb-left svg{ width:19px; height:19px; }
  .gb-side:active .gb-circle, .gb-left:active{ background:rgba(255,255,255,.10); }
  .gb-circle{
    width:30px; height:30px; border-radius:50%; background:var(--key-bg); color:var(--bar-icon);
    display:flex; align-items:center; justify-content:center;
  }
  .gb-circle svg{ width:20px; height:20px; }
  .gb-mic .gb-circle{ color:var(--bar-icon-dim); }
  .gb-mic.on .gb-circle{ color:var(--key-tag); }
  .gb-close{ width:30px; height:30px; border-radius:50%; background:var(--key-bg); display:none; align-items:center; justify-content:center; }
  .gb-close svg{ width:18px; height:18px; }
  .gb-left.is-close .gb-grid{ display:none; }
  .gb-left.is-close .gb-close{ display:flex; }

  /* Baris ikon (muncul saat grid ditekan): sticker, GIF, gear, terjemah, palet -- tersebar rata */
  .gboard-toolbar{
    display:flex; align-items:center; justify-content:space-around;
    flex:1 1 auto; min-width:0; height:100%; padding:0 2px;
  }
  .gtool-btn{
    border:none; background:none; color:var(--bar-icon); width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; padding:0;
    cursor:pointer; -webkit-tap-highlight-color:transparent; flex:0 0 auto; transition:background .1s ease;
  }
  .gtool-btn svg{ width:22px; height:22px; fill:currentColor; }
  .gtool-btn:active{ background:rgba(255,255,255,.12); }
  .gtool-btn.dim{ color:var(--bar-icon-dim); }
  .gtool-btn.gtool-gif{ font-family:inherit; font-size:.8rem; font-weight:700; letter-spacing:.06em; color:var(--bar-icon-dim); }
  .gtool-btn.gtool-gif.has-gif{ color:var(--bar-icon); }
  .gtool-btn.tool-active{ color:var(--key-tag); background:rgba(107,171,164,.16); }


  .keyboard{ background:var(--kb-bg); margin-top:0; padding:5px 13px 8px; }
  .krow{ display:flex; gap:var(--kgap); justify-content:center; margin-bottom:9px; }
  .krow:last-child{ margin-bottom:0; }
  /* Baris a-l digeser setengah tuts (persis Gboard). Baris pertama (angka) disembunyikan,
     jadi urutan nth-child: 2 = q-p, 3 = a-l, 4 = shift+z-m+hapus, 5 = baris bawah. */
  .krow:nth-child(3){ padding:0 calc((100% + var(--kgap)) / 20); }

  .key{
    position:relative; flex:1 1 0; min-width:0; height:var(--key-h); background:var(--key-bg);
    border:var(--key-border); border-radius:var(--key-radius);
    padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:none; font-family:Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    transition:background .05s ease;
  }
  .key .ch{ font-size:calc(1.375rem * var(--key-font-scale)); font-weight:400; color:var(--key-text); line-height:1; display:flex; align-items:center; justify-content:center; }
  .key .tag{ font-size:.42rem; font-weight:700; color:var(--key-tag); margin-top:2px; opacity:.85; line-height:1; }
  .key.fn{ background:var(--key-fn-bg); flex:1.3; }
  .key.fn .ch{ font-size:calc(1rem * var(--key-font-scale)); color:var(--key-text); }
  .key .ch svg{ width:calc(1.4rem * var(--key-font-scale)); height:calc(1.4rem * var(--key-font-scale)); fill:currentColor; display:block; }
  /* Shift & Backspace: ±1.58x lebar tuts huruf (diukur dari Gboard) */
  .key.fn.key-shift, .key.fn.key-backspace{ flex:1.58; }
  /* Baris bawah (rasio lebar diukur dari Gboard): ?123 1.48 | , 1 | emoji 1 | spasi 4.5 | . 1 | enter 1.6 */
  .key.fn#numBtn{ flex:1.48; }
  .key.key-punct{ background:var(--key-fn-bg); flex:1; }
  .key.key-emoji{ background:var(--key-bg); flex:1; }
  .key.space{ flex:4.5; }
  .key.space .ch{ font-size:calc(.72rem * var(--key-font-scale)); color:var(--muted); font-weight:500; letter-spacing:.02em; }
  .key.is-active{ background:var(--key-active-bg); }
  .key.fn.is-active, .key.key-punct.is-active{ background:var(--key-fn-active-bg); }
  .key.shift-on{ background:var(--key-shift-on-bg); }
  .key.caps-lock{ background:var(--key-capslock-bg); }
  .key.caps-lock .ch{ color:#10292B; }
  /* Ikon shift: garis luar saja; terisi saat shift aktif; garis bawah tambahan saat caps-lock */
  .ic-shift path{ fill:none; }
  .key.shift-on .ic-shift path, .key.caps-lock .ic-shift path{ fill:currentColor; }
  .ic-shift .caps-bar{ display:none; }
  .key.caps-lock .ic-shift .caps-bar{ display:block; }
  /* Enter: pil aksen teal, ikon gelap (warna & rasio dari Gboard) */
  .key.fn.key-enter{ background:var(--key-enter-bg); flex:1.6; border-radius:20px; }
  .key.fn.key-enter .ch{ color:#223134; }
  .key.fn.key-enter .tag{ color:#1B4A46; }
  .key.fn.key-enter.is-active{ background:#5A968F; }


  .emoji-panel{
    display:none;
    grid-template-columns:repeat(6,1fr);
    gap:5px;
    background:var(--kb-bg);
    border-radius:0;
    margin-top:2px;
    padding:6px 10px 8px;
    max-height:230px;
    overflow-y:auto;
  }
  .emoji-btn{
    position:relative; border:var(--key-border); background:var(--key-bg); border-radius:var(--key-radius);
    padding:7px 0 5px; cursor:pointer; box-shadow:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .emoji-btn .ch{ font-size:1.1rem; line-height:1; }
  .emoji-btn .tag{ font-size:.42rem; font-weight:700; color:var(--key-tag); }
  .keyboard, .emoji-panel{ contain: layout style paint; }
  .key, .emoji-btn{ touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .emoji-btn.is-active{ background:var(--key-active-bg); }
  .emoji-back-btn{ background:var(--key-active-bg); font-weight:700; }

  /* ---- Suggestion bar (prediksi kata) ---- */
  .suggest-bar{
    display:flex; align-items:center; justify-content:center;
    flex:1 1 auto; min-width:0; height:100%; padding:0; background:var(--kb-bg);
    overflow:hidden; contain:layout size;
  }
  /* Tiga slot sama lebar, dipisah garis tipis -- persis Gboard */
  .suggest-chip{
    position:relative; flex:1 1 0; min-width:0; height:100%; background:none; border:none;
    color:var(--key-text); font-family:inherit; font-size:1rem; padding:0 8px; border-radius:0;
    text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
  }
  .suggest-chip + .suggest-chip::before{
    content:''; position:absolute; left:0; top:50%; height:22px; margin-top:-11px; width:1px; background:var(--divider);
  }
  .suggest-chip:active{ background:rgba(255,255,255,.08); }
  /* BARU -- fix "tampilan bertumpuk, tidak rapat kayak Gboard": dulu pesan
     status (nada terdeteksi, tap, error izin, dsb) punya baris SENDIRI
     (.ime-status) di BAWAH suggest-bar -- jadi tiap kali ada bunyi kedeteksi
     (yang notabene TERUS-MENERUS terjadi selagi main gitar), tinggi total
     keyboard nambah satu baris lagi, mirip Gboard yang "meletus" tiap ada
     notifikasi. Gboard asli tidak begitu -- toast/status singkat numpang di
     SLOT yang SAMA dengan strip prediksi kata, gantian, bukan nambah baris.
     Sekarang showStatus() menulis ke #suggestBar itu sendiri (lihat JS),
     dibedain lewat modifier class ini -- tinggi bar tetap 38px yang sama
     persis, cuma isinya yang gantian antara saran kata dan pesan status. */
  .suggest-bar.status-mode{ justify-content:center; }
  .suggest-status-text{
    max-width:92%; font-size:.78rem; text-align:center; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; padding:6px 12px; border-radius:8px;
    color:#FFFFFF; font-family:Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  .suggest-bar.status-error .suggest-status-text{ background:#B3261E; }
  .suggest-bar.status-ok .suggest-status-text{ background:#1F6B47; }

  /* ---- Panel Settings (tema) ---- */
  .settings-panel{
    display:none; padding:14px 12px; background:var(--kb-bg); color:var(--key-text);
    font-family:Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  .settings-panel h4{ margin:0 0 10px; font-size:.85rem; color:var(--key-tag); }
  .theme-swatches{ display:flex; gap:12px; flex-wrap:wrap; }
  .theme-swatch{
    width:44px; height:44px; border-radius:50%; border:2px solid transparent;
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1rem;
  }
  .theme-swatch.selected{ border-color:var(--key-tag); }
  .theme-swatch[data-theme="dark"]{ background:#223134; }
  .theme-swatch[data-theme="light"]{ background:#FFFFFF; }
  .theme-swatch[data-theme="blue"]{ background:#13315C; }
  .theme-swatch[data-theme="purple"]{ background:#3A2C4A; }
  .theme-swatch[data-theme="auto"]{ background:linear-gradient(135deg, #FFFFFF 50%, #202124 50%); color:#5F6368; }
  .theme-swatch[data-theme="green"]{ background:#17402C; }
  .font-scale-row{ display:flex; align-items:center; gap:10px; }
  .font-scale-row input[type="range"]{ flex:1; accent-color:var(--key-tag); height:24px; }
  .font-scale-row span{ font-size:.8rem; font-weight:700; color:var(--key-text); min-width:38px; text-align:right; }
  .key-border-row{ display:flex; align-items:center; gap:10px; font-size:.82rem; color:var(--key-text); cursor:pointer; }
  .key-border-row input[type="checkbox"]{ width:20px; height:20px; accent-color:var(--key-tag); }

  /* ---- Panel Clipboard ---- */
  .clipboard-panel{
    display:none; flex-direction:column; gap:6px; padding:8px;
    background:var(--kb-bg); max-height:260px; overflow-y:auto;
  }
  .clipboard-item{
    background:var(--key-bg); color:var(--key-text); border:none; border-radius:8px;
    padding:10px 12px; text-align:left; font-family:inherit; font-size:.85rem;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .clipboard-item:active{ background:var(--key-active-bg); }
  .clipboard-empty{ color:var(--muted); font-size:.8rem; padding:10px 4px; }

  /* ---- Mode satu tangan ---- */
  .kb-float-wrap.one-left .keyboard-inner,
  .kb-float-wrap.one-right .keyboard-inner{ transform-origin:bottom left; transform:scale(.78); }
  .kb-float-wrap.one-right .keyboard-inner{ transform-origin:bottom right; margin-left:auto; }
  .one-hand-flip{
    display:none; position:absolute; bottom:8px; width:40px; height:40px; border-radius:50%;
    background:var(--key-fn-bg); color:var(--key-text); border:none; font-size:1.1rem;
  }
  .kb-float-wrap.one-left .one-hand-flip{ display:block; right:6px; }
  .kb-float-wrap.one-right .one-hand-flip{ display:block; left:6px; }

  .key .bubble, .emoji-btn .bubble{
    position:absolute; bottom:100%; left:50%;
    transform:translateX(-50%) translateY(6px) scale(.9);
    background:var(--key-bubble-bg); color:var(--key-bubble-text); font-weight:400; font-size:1.7rem; line-height:1;
    min-width:calc(100% + 6px); text-align:center; padding:11px 8px 13px; border-radius:10px;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
    opacity:0; pointer-events:none; white-space:nowrap;
    transition:opacity .08s ease, transform .08s ease; z-index:5;
  }
  .key .bubble.show, .emoji-btn .bubble.show{ opacity:1; transform:translateX(-50%) translateY(-6px) scale(1); }

  /* ---- Panel GIF (placeholder stiker — lihat catatan di JS soal integrasi Tenor asli) ---- */
  .gif-panel{
    display:none; flex-wrap:wrap; gap:6px; padding:10px 8px;
    background:var(--kb-bg); max-height:230px; overflow-y:auto;
  }
  .gif-item{
    flex:0 0 calc(33.333% - 4px); aspect-ratio:1.3/1; border:none; border-radius:10px;
    background:var(--key-bg); color:var(--key-text); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; font-size:1.6rem;
    box-shadow:0 1.5px 0 var(--shadow); cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .gif-item .gif-label{ font-size:.55rem; font-weight:700; color:var(--muted); }
  .gif-item:active{ background:var(--key-active-bg); }

  /* ---- Panel Mode Terjemah ---- */
  .translate-panel{
    display:none; flex-direction:column; gap:8px; padding:10px 10px 12px;
    background:var(--kb-bg); color:var(--key-text); font-family:Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  .translate-bar{ display:flex; align-items:center; gap:8px; }
  .translate-lang{
    flex:1; background:var(--key-bg); color:var(--key-text); border:none; border-radius:8px;
    padding:8px 6px; font-family:inherit; font-size:.82rem;
  }
  .translate-swap{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:none;
    background:var(--key-fn-bg); color:var(--key-text); font-size:1rem;
  }
  .translate-preview{
    background:var(--key-bg); border-radius:8px; padding:10px; font-size:.9rem;
    min-height:44px; color:var(--key-text); line-height:1.35;
  }
  .translate-insert{
    background:var(--key-enter-bg); color:#062B22; border:none; border-radius:8px;
    padding:9px; font-weight:700; font-size:.85rem; font-family:inherit;
  }
  .translate-note{ font-size:.66rem; color:var(--muted); line-height:1.4; }

  /* ---- Badge angka pojok di baris q-p (mirip hint long-press angka di Gboard) ----
     Ukuran ~30% dari ukuran huruf utama (1.05rem * .3 ≈ .315rem), sesuai rasio
     sub-teks angka di Gboard asli, dan tetap ikut skala --key-font-scale. */
  .key .corner-num{
    position:absolute; top:3px; right:5px;
    font-size:calc(.5rem * var(--key-font-scale));
    font-weight:400; color:var(--key-text); opacity:.6; line-height:1;
  }
  /* ---- Baris angka: tersembunyi di mode huruf (persis Gboard), cuma tampil di mode ?123 ---- */
  .krow-nums{ display:none; }
  .keyboard.show-num-row .krow-nums{ display:flex; }
  /* Di mode ?123 baris angka sudah tampil, jadi badge angka pojok tidak perlu lagi */
  .keyboard.show-num-row .corner-num{ display:none; }
  /* ---- Highlight sesaat saat tuts sedang ditekan-tahan buat ambil angka pojok ---- */
  .key.key-longpress-num{ background:var(--key-active-bg); }
  .key.key-longpress-num .ch{ opacity:.35; }
  .key.key-longpress-num .corner-num{ opacity:1; font-size:.85rem; color:var(--key-tag); transition:font-size .08s ease; }

  /* ---- Clipboard: tombol hapus per item + hapus semua ---- */
  .clipboard-toolbar{ display:flex; justify-content:flex-end; padding:0 4px 4px; }
  .clipboard-clear{
    background:none; border:1px solid var(--bar-icon-dim); border-radius:999px; color:var(--bar-icon); font-size:.78rem; font-weight:700;
    padding:7px 14px; cursor:pointer;
  }
  .clipboard-item-row{ display:flex; align-items:stretch; gap:4px; }
  .clipboard-item-row .clipboard-item{ flex:1; }
  .clipboard-item-del{
    flex:0 0 46px; min-height:40px; background:var(--key-fn-bg); color:var(--bar-icon); border:none;
    border-radius:8px; font-size:1rem; cursor:pointer;   /* area sentuh besar: gampang dihapus */
  }


  body.hide-tags .key .tag, body.hide-tags .emoji-btn .tag{ display:none; }

  /* ---- Panel alat (muncul saat ikon grid ditekan; menggantikan area tuts) ---- */
  .tool-panel{ display:none; padding:14px 0 10px; background:var(--kb-bg); }
  .tool-pages{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; }
  .tool-pages::-webkit-scrollbar{ display:none; }
  .tool-page{ flex:0 0 100%; scroll-snap-align:start; min-width:0; padding:0 14px; box-sizing:border-box; }
  .tool-foot{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-top:12px; padding:0 14px; }
  .tool-dots{ display:flex; gap:6px; grid-column:2; }
  .tool-dots i{ width:6px; height:6px; border-radius:50%; background:var(--bar-icon-dim); }
  .tool-dots i.on{ background:var(--bar-icon); }
  .tool-hint{ grid-column:1; font-size:.72rem; color:var(--key-tag); }
  .tool-edit{
    grid-column:3; justify-self:end; display:flex; align-items:center; justify-content:center;
    width:72px; height:32px; border-radius:999px; border:1.5px solid var(--bar-icon-dim); background:none;
    color:var(--bar-icon); cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .tool-edit svg{ width:18px; height:18px; fill:currentColor; }
  .tool-edit:active{ background:rgba(255,255,255,.1); }
  /* item yang disembunyikan lewat pensil: hilang, kecuali saat mode sesuaikan (tampil pudar) */
  .tool-hidden{ display:none !important; }
  .editing .tool-hidden{ display:flex !important; opacity:.35; }
  .editing [data-tool]{ outline:1.5px dashed var(--bar-icon-dim); outline-offset:-2px; }
  .lp-txt{ display:flex; flex-direction:column; line-height:1.2; min-width:0; flex:1 1 auto; overflow:hidden; }
  .lp-txt small{ font-size:.68rem; opacity:.65; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lang-row .lang-pick{ height:auto; min-height:48px; padding-top:4px; padding-bottom:4px; min-width:0; overflow:hidden; }
  .lang-row .lang-pick .lang-tag{ flex:0 0 auto; }
  .tool-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tool-pill{
    display:flex; align-items:center; gap:8px; min-width:0; height:42px; padding:0 12px;
    border:none; border-radius:999px; background:var(--pill-bg); color:var(--key-text);
    font-family:inherit; font-size:.92rem; cursor:pointer; text-align:left;
    -webkit-tap-highlight-color:transparent;
  }
  .tool-pill:active{ background:var(--key-fn-active-bg); }
  .tool-pill svg{ width:22px; height:22px; fill:currentColor; flex:0 0 auto; }
  .tool-pill .lbl{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
  .tool-pill .chev svg{ width:16px; height:16px; fill:none; stroke:currentColor; opacity:.85; }
  .tool-pill .chev{ display:flex; }
  .tool-pill.on{ background:rgba(107,171,164,.28); }
  .tool-pill .pill-tag{ font-size:.7rem; font-weight:700; opacity:.75; flex:0 0 auto; }

  /* ---- Bahasa: popup cepat (tahan spasi) + panel kelola ---- */
  .lang-popup{
    display:none; position:absolute; left:50%; bottom:64px; transform:translateX(-50%);
    min-width:220px; max-width:92%; padding:6px; z-index:30; overflow-y:auto; overscroll-behavior:contain;
    background:var(--pill-bg); border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .lang-item{
    display:flex; align-items:center; gap:10px; width:100%; height:40px; flex:0 0 auto; padding:0 14px;
    border:none; border-radius:12px; background:none; color:var(--key-text);
    font-family:inherit; font-size:.95rem; text-align:left; cursor:pointer;
  }
  .lang-item:active{ background:rgba(255,255,255,.1); }
  .lang-item.active{ background:rgba(107,171,164,.25); }
  .lang-item .lang-tag{ margin-left:auto; font-size:.7rem; font-weight:700; opacity:.7; }
  .lang-item.manage{ color:var(--key-tag); }
  .lang-item svg{ width:20px; height:20px; fill:currentColor; }
  .lang-panel{ display:none; flex-direction:column; gap:2px; padding:8px 10px; background:var(--kb-bg); max-height:250px; overflow-y:auto; }
  .lang-panel h4{ margin:4px 4px 6px; font-size:.8rem; color:var(--key-tag); font-weight:500; }
  .lang-row{ display:flex; align-items:center; gap:8px; min-height:44px; }
  .lang-row .lang-pick{
    flex:1 1 auto; display:flex; align-items:center; gap:10px; height:44px; padding:0 12px;
    border:none; border-radius:12px; background:none; color:var(--key-text); font-family:inherit; font-size:.95rem;
    text-align:left; cursor:pointer;
  }
  .lang-row .lang-pick.active{ background:rgba(107,171,164,.25); }
  .lang-row .lang-pick .lang-tag{ margin-left:auto; font-size:.7rem; font-weight:700; opacity:.7; }
  .lang-row input[type="checkbox"]{ width:22px; height:22px; accent-color:var(--key-tag); flex:0 0 auto; margin-right:6px; }

  /* Setelan: bisa dibuka penuh (gear) atau cuma satu bagian (palet = tema, ubah ukuran = ukuran) */
  .settings-panel[data-filter="theme"] .sec:not(.sec-theme),
  .settings-panel[data-filter="size"] .sec:not(.sec-size){ display:none; }
  /* ---- Responsif: layar sangat sempit / tablet / landscape ---- */
  @media (max-width:340px){
    :root{ --kgap:3px; --key-h:36px; }
    .keyboard{ padding-left:6px; padding-right:6px; }
    .krow{ margin-bottom:7px; }
    .key .ch{ font-size:calc(1.15rem * var(--key-font-scale)); }
  }
  @media (min-width:600px){
    :root{ --key-h:46px; --kgap:6px; }
    .kb-float-wrap{ max-width:720px; }
    .keyboard{ padding-left:18px; padding-right:18px; }
    .key .ch{ font-size:calc(1.55rem * var(--key-font-scale)); }
    .suggest-chip{ font-size:1.1rem; }
  }
  /* PENTING: di dalam keyboard, "viewport" cuma selebar layar x setinggi area keyboard, jadi
     orientation:landscape SALAH-KENA di HP portrait (lebar 360 > tinggi 240). Deteksi landscape
     sungguhan lewat lebar >= 560 dan tinggi keyboard pendek. */
  @media (min-width:560px) and (max-height:340px){
    :root{ --key-h:32px; }
    .krow{ margin-bottom:5px; }
    .key .tag{ display:none; }
    .key .ch{ font-size:calc(1.15rem * var(--key-font-scale)); }
  }

</style>
</head>
<body>

<div class="kb-float-wrap" id="kbWrap">
  <div class="feature-bar" id="featureBar">
    <button class="gb-side gb-left" id="featureToggleBtn" type="button" title="Menu" aria-label="Menu">
      <span class="gb-grid" data-icon="grid"></span>
      <span class="gb-close" data-icon="close"></span>
    </button>
    <div class="bar-center">
      <div class="suggest-bar" id="suggestBar"></div>
      <div class="gboard-toolbar" id="gboardToolbar" style="display:none;">
        <button class="gtool-btn dim" id="stickerBtn" data-tool="sticker" type="button" title="Stiker (belum tersedia)" aria-disabled="true"><span data-icon="sticker"></span></button>
        <button class="gtool-btn gtool-gif has-gif" id="gifBtn" data-tool="gif" type="button" title="GIF">GIF</button>
        <button class="gtool-btn" id="settingsBtn" data-tool="gear" type="button" title="Setelan"><span data-icon="gear"></span></button>
        <button class="gtool-btn" id="translateBtn" data-tool="translate" type="button" title="Terjemahkan"><span data-icon="translate"></span></button>
        <button class="gtool-btn" id="themeBtn" data-tool="theme" type="button" title="Tema"><span data-icon="palette"></span></button>
      </div>
    </div>
    <button class="gb-side gb-mic" id="micToolBtn" type="button" title="Dengarkan gitar (otomatis aktif)" aria-label="Mic gitar"><span class="gb-circle" data-icon="mic"></span></button>
  </div>
  <div class="tool-panel" id="toolPanel">
    <div class="tool-pages" id="toolPages">
      <div class="tool-page"><div class="tool-grid">
        <button class="tool-pill" id="clipboardBtn" data-tool="clip" type="button"><span data-icon="clipboard"></span><span class="lbl">Papan klip</span><span class="chev" data-icon="chev"></span></button>
        <button class="tool-pill" id="emojiToolBtn" data-tool="emoji" type="button"><span data-icon="emoji"></span><span class="lbl">Emoji</span><span class="chev" data-icon="chev"></span></button>

        <button class="tool-pill" id="sizeBtn" data-tool="size" type="button"><span data-icon="resize"></span><span class="lbl">Ubah ukuran</span></button>
        <button class="tool-pill" id="noteTagBtn" data-tool="tags" type="button"><span data-icon="keyboard"></span><span class="lbl">Label nada</span></button>
      </div></div>
      <div class="tool-page"><div class="tool-grid">
        <button class="tool-pill" id="autoCorrectBtn" data-tool="ac" title="Koreksi otomatis" type="button"><span data-icon="spell"></span><span class="lbl">Koreksi</span></button>
        <button class="tool-pill" id="autoCapsBtn" data-tool="caps" title="Huruf besar otomatis" type="button"><span data-icon="shift"></span><span class="lbl">Kapital</span></button>
        <button class="tool-pill" id="suggestBtn" data-tool="suggest" type="button"><span data-icon="check"></span><span class="lbl">Saran kata</span></button>
        <button class="tool-pill" id="shareBtn" data-tool="share" type="button"><span data-icon="share"></span><span class="lbl">Bagikan</span></button>
        <button class="tool-pill" id="settingsPill" data-tool="settings2" type="button"><span data-icon="gear"></span><span class="lbl">Setelan</span></button>
        <button class="tool-pill" id="resetDictBtn" data-tool="reset" title="Hapus kamus pribadi" type="button"><span data-icon="trash"></span><span class="lbl">Reset kamus</span></button>
      </div></div>
    </div>
    <div class="tool-foot">
      <span class="tool-hint" id="toolHint"></span>
      <div class="tool-dots" id="toolDots"><i class="on"></i><i></i></div>
      <button class="tool-edit" id="toolEditBtn" type="button" title="Sesuaikan item"><span data-icon="pencil"></span></button>
    </div>
  </div>
  <div class="lang-panel" id="langPanel"></div>
  <div class="settings-panel" id="settingsPanel">
    <div class="sec sec-theme">
    <h4>Pilih Tema Warna</h4>
    <div class="theme-swatches" id="themeSwatches">
      <div class="theme-swatch" data-theme="auto" title="Otomatis (ikuti sistem)">◐</div>
      <div class="theme-swatch" data-theme="dark" title="Gelap"></div>
      <div class="theme-swatch" data-theme="light" title="Terang">🔆</div>
      <div class="theme-swatch" data-theme="blue" title="Biru"></div>
      <div class="theme-swatch" data-theme="purple" title="Ungu"></div>
      <div class="theme-swatch" data-theme="green" title="Hijau"></div>
    </div>
    </div>
    <div class="sec sec-size">
    <h4 style="margin-top:16px;">Ukuran Huruf Tuts</h4>
    <div class="font-scale-row">
      <input type="range" id="fontScaleRange" min="85" max="200" step="1" value="100">
      <span id="fontScaleLabel">100%</span>
    </div>
    </div>
    <div class="sec sec-border">
    <h4 style="margin-top:16px;">Batas Tuts</h4>
    <label class="key-border-row">
      <input type="checkbox" id="keyBorderToggle">
      <span>Tampilkan garis batas di setiap tuts</span>
    </label>
    </div>
  </div>
  <div class="clipboard-panel" id="clipboardPanel"></div>
  <div class="gif-panel" id="gifPanel"></div>
  <div class="translate-panel" id="translatePanel">
    <div class="translate-bar">
      <select class="translate-lang" id="translateFrom">
        <option value="id">Indonesia</option>
        <option value="en">Inggris</option>
      </select>
      <button class="translate-swap" id="translateSwap" type="button" title="Tukar bahasa">⇄</button>

        <option value="en">Inggris</option>
        <option value="id">Indonesia</option>
      </select>
    </div>
    <div class="translate-preview" id="translatePreview">Ketik pakai tuts di bawah, hasil terjemahan muncul di sini…</div>
    <button class="translate-insert" id="translateInsert" type="button">Sisipkan terjemahan ⏎</button>
    <div class="translate-note">Kamus bawaan terbatas (offline, kata per kata). Untuk hasil akurat penuh, sambungkan API terjemahan (mis. Google Cloud Translation) lewat jembatan Android.</div>
  </div>

    <div class="keyboard" id="keyboard"></div>
    <div class="emoji-panel" id="emojiPanel"></div>
  </div>
  <div class="lang-popup" id="langPopup"></div>
  <button class="one-hand-flip" id="oneHandFlip" type="button" title="Pindah sisi">⇄</button>
</div>

    onehand:   _svg('<path d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14zM9.5 13.2l2.2-2.2-2.2-2.2 1-1 3.2 3.2-3.2 3.2z"/>'),

  document.querySelectorAll('[data-icon]').forEach(el => { if(ICONS[el.dataset.icon]) el.innerHTML = ICONS[el.dataset.icon]; });

  // ---------------- Note table: E2 (open low E) upward. Setiap tuts — termasuk spasi, Shift,
  // Backspace, Enter, dan tombol ganti mode — mendapat satu nada sendiri, berurutan dari nada
  // terendah (pojok kiri atas) ke nada tertinggi (pojok kanan bawah), mengikuti urutan visual keyboard. ----------------
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const BASE_MIDI = 40; // E2

  // Urutan visual keyboard (persis urutan render): baris angka, baris q-p, baris a-l,
  // [Shift] + baris z-m + [Backspace], lalu baris bawah [?123][,][emoji][spasi][.][Enter] (urutan Gboard)
  const KEY_DEFS = [
    ...['1','2','3','4','5','6','7','8','9','0'].map(ch=>({type:'letter', char:ch})),
    ...['q','w','e','r','t','y','u','i','o','p'].map((ch,i)=>({type:'letter', char:ch, cornerNum:(i+1)%10})),
    ...['a','s','d','f','g','h','j','k','l'].map(ch=>({type:'letter', char:ch})),
    {type:'shift'},
    ...['z','x','c','v','b','n','m'].map(ch=>({type:'letter', char:ch})),
    {type:'backspace'},
    {type:'num-toggle'},
    {type:'literal', char:',', label:','},
    {type:'emoji-toggle'},
    {type:'literal', char:' ', label:'', big:true},
    {type:'literal', char:'.', label:'.'},
    {type:'enter'},
  ];
  const NOTE_COUNT = KEY_DEFS.length; // 44

  // Rentang index (di KEY_DEFS / NOTES) tuts huruf yang boleh diganti jadi simbol / huruf besar
  const LETTER_INDICES = [
    ...Array.from({length:10},(_,i)=>10+i), // baris q-p
    ...Array.from({length:9},(_,i)=>20+i),  // baris a-l
    ...Array.from({length:7},(_,i)=>30+i),  // baris z-m
  ];

  // Standard guitar tuning (open string MIDI numbers), string 6 = low E to string 1 = high e
  const TUNING = [
    {string:6, open:'E', midi:40},
    {string:5, open:'A', midi:45},
    {string:4, open:'D', midi:50},
    {string:3, open:'G', midi:55},
    {string:2, open:'B', midi:59},
    {string:1, open:'e', midi:64},
  ];
  const MAX_FRET = 20;
  function findFret(midi){
    let best = null;
    TUNING.forEach(t=>{
      const fret = midi - t.midi;
      if(fret>=0 && fret<=MAX_FRET){
        if(!best || fret<best.fret) best = {string:t.string, open:t.open, fret};
      }
    });
    return best;
  }

  const NOTES = [];
  for(let i=0;i<NOTE_COUNT;i++){
    const midi = BASE_MIDI + i;
    const freq = 440 * Math.pow(2, (midi-69)/12);
    const name = NOTE_NAMES[((midi%12)+12)%12] + (Math.floor(midi/12)-1);
    const pos = findFret(midi);
    NOTES.push({
      idx: i, midi, freq, name,
      string: pos ? pos.string : null,
      fret: pos ? pos.fret : null
    });
  }

  // ---------------- Keyboard layout: SEMUA tuts (44) responsif nada ----------------
  const keyboardEl = document.getElementById('keyboard');
  const keyMap = {};      // char fisik -> element (huruf/angka/koma/spasi/titik)
  const allKeys = [];     // index 0..43 -> element, sejajar dengan NOTES

  function makeKeyEl(def, note){
    const btn = document.createElement('button');
    btn.dataset.freq = note.freq;
    btn.dataset.note = note.name;
    btn.dataset.string = note.string;
    btn.dataset.fret = note.fret;
    btn.title = note.name;

    if(def.type==='letter'){
      btn.className='key';
      btn.dataset.type='note';
      btn.dataset.origChar = def.char;
      const cornerBadge = (def.cornerNum!==undefined) ? '<span class="corner-num">'+def.cornerNum+'</span>' : '';
      btn.innerHTML = '<span class="ch">'+def.char+'</span><span class="tag">'+note.name+'</span>'+cornerBadge+'<span class="bubble"></span>';
      if(def.cornerNum!==undefined){
        btn.dataset.cornerNum = def.cornerNum;
        wireLongPressNumber(btn);
      } else {
        btn.addEventListener('pointerdown', ()=> manualPress(btn));
      }
      keyMap[def.char] = btn;
    } else if(def.type==='shift'){
      btn.className='key fn key-shift';
      btn.id='shiftBtn';
      btn.innerHTML='<span class="ch">'+ICONS.shift+'</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> shiftToggle(btn));
      keyMap['shift'] = btn;
    } else if(def.type==='backspace'){
      btn.className='key fn key-backspace';
      btn.dataset.type='backspace';
      btn.innerHTML='<span class="ch">'+ICONS.backspace+'</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> functionalPress(btn)); // tekan sebentar = hapus 1 karakter, langsung, tanpa jeda
      wireLongPressRepeat(btn, backspace); // tahan = mulai berulang otomatis & makin cepat (lihat wireLongPressRepeat)
      keyMap['backspace'] = btn;
    } else if(def.type==='emoji-toggle'){
      btn.className='key fn key-emoji'; btn.id='emojiBtn';
      btn.innerHTML='<span class="ch">'+ICONS.emoji+'</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=>{ flash(btn); setMode(mode==='emoji' ? 'letters' : 'emoji'); });
    } else if(def.type==='num-toggle'){
      btn.className='key fn'; btn.id='numBtn';
      btn.innerHTML='<span class="ch">?123</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=>{ flash(btn); setMode(mode==='symbols' ? 'letters' : 'symbols'); });
    } else if(def.type==='literal'){
      btn.className = def.big ? 'key space' : 'key key-punct';
      btn.dataset.type='literal';
      btn.dataset.char = def.char;
      btn.innerHTML = '<span class="ch">'+(def.label||def.char)+'</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> functionalPress(btn));
      keyMap[def.char] = btn;
    } else if(def.type==='enter'){
      btn.className='key fn key-enter';
      btn.dataset.type='enter';
      btn.innerHTML='<span class="ch">'+ICONS.enter+'</span><span class="tag">'+note.name+'</span><span class="bubble"></span>';
      btn.addEventListener('pointerdown', ()=> functionalPress(btn));
      keyMap['enter'] = btn;
    }
    return btn;
  }

  function buildRow(defs, notes, extraClass){
    const row = document.createElement('div');
    row.className = extraClass ? ('krow '+extraClass) : 'krow';
    defs.forEach((def, i)=>{
      const note = notes[i];
      const el = makeKeyEl(def, note);
      row.appendChild(el);
      allKeys[note.idx] = el;
    });
    keyboardEl.appendChild(row);
    return row;
  }

  // Baris angka: disembunyikan secara default (persis Gboard -- baris angka
  // cuma muncul di mode ?123). Di mode huruf, angkanya "di belakang" tuts q-p
  // lewat badge pojok + tekan-tahan (lihat wireLongPressNumber di bawah).
  // Elemen tuts-nya TETAP dibuat & tetap terhubung penuh ke pemetaan nada gitar
  // (allKeys[idx]) walau tersembunyi -- petikan gitar di rentang nada itu tetap
  // jalan seperti biasa, cuma tidak kelihatan animasinya selama baris disembunyikan.
  const numberRowEl = buildRow(KEY_DEFS.slice(0,10),  NOTES.slice(0,10), 'krow-nums');   // angka
  buildRow(KEY_DEFS.slice(10,20), NOTES.slice(10,20));  // q-p
  buildRow(KEY_DEFS.slice(20,29), NOTES.slice(20,29));  // a-l
  buildRow(KEY_DEFS.slice(29,38), NOTES.slice(29,38));  // Shift + z-m + Backspace
  buildRow(KEY_DEFS.slice(38,44), NOTES.slice(38,44));  // emoji, ?123, , spasi . Enter

  // ---------------- Pelacak teks internal ----------------
  // Halaman ini sekarang murni tampilan keyboard (tidak ada kotak teks
  // visual). Variabel `text`/`cursorPos` di bawah TETAP dipertahankan
  // secara internal (tanpa dirender ke layar) karena masih dipakai untuk
  // fitur prediksi kata (lihat getCurrentWordRange) dan untuk menghitung
  // berapa karakter yang perlu dihapus saat kata diganti lewat saran.
  let text = '';
  let cursorPos = 0;

  // ---------------- Jembatan ke Android InputMethodService ----------------
  // Jika halaman ini dimuat di dalam HtmlKeyboardService.java (lewat addJavascriptInterface),
  // window.AndroidKeyboard akan otomatis tersedia dan setiap ketikan diteruskan
  // ke InputConnection kolom teks yang sedang aktif (WhatsApp, Instagram, dll).
  // Kalau dibuka di browser biasa untuk uji coba, bridge ini tidak ada sehingga
  // keyboard tetap berfungsi normal memakai kotak teks internal di atas.
  function hasAndroidBridge(){
    return !!(window.AndroidKeyboard && window.AndroidKeyboard.commitText);
  }
  function bridgeCommit(str){
    if(hasAndroidBridge()){
      try{ window.AndroidKeyboard.commitText(str); }catch(e){}
    }
  }
  function bridgeDeleteBackward(){
    if(window.AndroidKeyboard && window.AndroidKeyboard.deleteBackward){
      try{ window.AndroidKeyboard.deleteBackward(); }catch(e){}
    }
  }
  function bridgeEnter(){
    if(window.AndroidKeyboard && window.AndroidKeyboard.sendEnter){
      try{ window.AndroidKeyboard.sendEnter(); return true; }catch(e){}
    }
    return false;
  }

  // Teks `text` di atas cuma pelacak INTERNAL buat mikir saran kata (kata yang
  // lagi diketik + satu kata sebelumnya buat prediksi bigram) -- BUKAN isi asli
  // kolom chat (itu langsung ke InputConnection Android lewat bridgeCommit).
  // Sebelumnya nggak pernah dipangkas, jadi kalau kamu ngetik lama tanpa ganti
  // kolom, dia terus membengkak sepanjang hari -> tiap ketik/hapus jadi makin
  // berat karena selalu mengolah ulang string yang makin panjang. Sekarang
  // dikunci maksimal 200 karakter terakhir saja, cukup buat kebutuhan saran,
  // jadi ngetik & hapus tetap ringan berapa lama pun sesi ngetiknya.
  const TEXT_TRACK_MAX = 200;
  function trimTrackedText(){
    if(text.length > TEXT_TRACK_MAX){
      const cut = text.length - TEXT_TRACK_MAX;
      text = text.slice(cut);
      cursorPos = Math.max(0, cursorPos - cut);
    }
  }

  // Karakter yang menandai "kata baru saja selesai diketik" (spasi, enter, tanda baca).
  // Begitu salah satu ini muncul, kata sebelum karakter ini langsung dipelajari
  // ke kamus pribadi (lihat learnWord) — persis Gboard, otomatis tanpa menu apa pun.
  const WORD_BOUNDARY_RE = /^[\s.,!?;:)\]}"'\u201d]$/;
  // Render saran kata ditunda ke frame berikutnya (digabung kalau mengetik cepat) supaya
  // thread JS langsung bebas menerima ketukan berikutnya. Teks sudah dikirim ke Android
  // SEBELUM ini, jadi tidak ada ketikan yang tertunda.
  var suggestScheduled = false;
  function scheduleSuggestions(){
    if(suggestScheduled) return;
    suggestScheduled = true;
    requestAnimationFrame(()=>{ suggestScheduled = false; updateAutoCapsLocal(); renderSuggestions(); });
  }
  function appendText(str){
    if(selectionActive){ if(isComposing()) abortCompose(); resetTrackedText(); selectionActive = false; }   // ketikan menggantikan blok biru
    const SL = scriptLang();
    if(SL && mode === 'letters'){
      // Huruf latin (dan tanda khusus bahasa itu, mis. ' untuk ь) disusun jadi huruf bahasa tsb.
      if(/^[a-zA-Z]$/.test(str) || (isComposing() && SL.extraKeys && str.length === 1 && SL.extraKeys.indexOf(str) >= 0)){
        lastAutoCorrect = null;
        composeLetter(str);
        return;
      }
      if(isComposing()){
        if(str === ' ' && SL.noSpace){                     // Jepang: spasi = pilih kanji pertama (kalau ada)
          const cv = SL.conv && SL.conv[composeOut];
          if(cv && cv.length){ setComposeOut(cv[0]); finishCompose(true, true); }
          else finishCompose(true);
          return;
        }
        finishCompose(true);
      }
      if(SL.punct && SL.punct[str]) str = SL.punct[str];   // tanda baca khas bahasa (، ؟ 。 ।)
    } else if(isComposing()){
      finishCompose(true);
    }
    lastAutoCorrect = null;
    let didAC = null;
    if(str.length === 1 && AC_TRIGGERS.has(str)){
      const ac = tryAutoCorrect();
      if(ac){
        bridgeDeleteBackwardN(ac.word.length);
        bridgeCommit(ac.fixed);
        text = text.slice(0, ac.start) + ac.fixed + text.slice(ac.end);
        cursorPos = ac.start + ac.fixed.length;
        didAC = { orig: ac.word, fixed: ac.fixed, trigger: str };
      }
    }
    if(WORD_BOUNDARY_RE.test(str)){
      const { word } = getCurrentWordRange();
      if(word) learnWord(word);
    }
    text = text.slice(0,cursorPos) + str + text.slice(cursorPos);
    cursorPos += str.length;
    trimTrackedText();
    bridgeCommit(str);
    if(didAC){ didAC.cursor = cursorPos; lastAutoCorrect = didAC; }   // ketuk hapus SEKALI lagi = urungkan koreksi
    scheduleSuggestions();
    if(document.getElementById('translatePanel').style.display==='flex') updateTranslatePreview();
  }
  function backspace(){
    if(isComposing()){ lastAutoCorrect = null; composeBackspace(); return; }
    if(lastAutoCorrect && cursorPos === lastAutoCorrect.cursor && !selectionActive){
      // Urungkan koreksi otomatis: kembalikan kata persis seperti yang kamu ketik.
      const ac = lastAutoCorrect; lastAutoCorrect = null;
      const n = ac.fixed.length + ac.trigger.length;
      bridgeDeleteBackwardN(n);
      bridgeCommit(ac.orig);
      text = text.slice(0, cursorPos - n) + ac.orig + text.slice(cursorPos);
      cursorPos = cursorPos - n + ac.orig.length;
      learnWord(ac.orig);            // kamu memang mau kata ini -> jangan dikoreksi lagi
      scheduleSuggestions();
      return;
    }
    lastAutoCorrect = null;
    // Selalu diteruskan ke Android, walau pelacak lokal kosong: kolom bisa berisi teks yang
    // BUKAN diketik lewat keyboard ini, dan bisa ada teks terseleksi (blok biru). Java yang
    // memutuskan: ada seleksi -> seluruh blok terhapus sekali ketuk; tidak ada -> 1 karakter.
    bridgeDeleteBackward();
    if(selectionActive){
      resetTrackedText();          // isi kolom berubah drastis, pelacak lama tidak valid lagi
      selectionActive = false;
    } else if(cursorPos > 0){
      text = text.slice(0,cursorPos-1) + text.slice(cursorPos);
      cursorPos -= 1;
    }
    scheduleSuggestions();
    if(document.getElementById('translatePanel').style.display==='flex') updateTranslatePreview();
  }
  function pressEnter(){
    if(isComposing()) finishCompose(true);
    lastAutoCorrect = null;
    const { word } = getCurrentWordRange();
    if(word) learnWord(word);
    // Panggil sendEnter() dulu (bisa memicu tombol Kirim/Cari sesuai kolom aktif),
    // baru perbarui pelacak teks lokal secara terpisah agar tidak terkirim dobel.
    bridgeEnter();
    text = text.slice(0,cursorPos) + '\n' + text.slice(cursorPos);
    cursorPos += 1;
    trimTrackedText();
    scheduleSuggestions();
  }

  // ---------------- Bubble + flash ----------------
  function flash(el){ el.classList.add('is-active'); setTimeout(()=> el.classList.remove('is-active'), 80); }
  function showBubble(el, label){
    const bubble = el.querySelector('.bubble');
    if(!bubble) return;
    bubble.textContent = label;
    bubble.classList.add('show');
    setTimeout(()=> bubble.classList.remove('show'), 260);
  }
  let statusHideTimer = null;
  function showStatus(msg){
    // BARU: pesan status sekarang numpang di SLOT #suggestBar yang sama
    // dengan saran kata (bukan baris terpisah lagi) -- lihat penjelasan
    // lengkap di komentar .suggest-bar.status-mode CSS. Tinggi keyboard jadi
    // tidak pernah berubah gara-gara status muncul/hilang, persis Gboard.
    const bar = document.getElementById('suggestBar');
    if(!bar) return;
    // Umpan balik (nada terdeteksi, tap, error izin, dst) harus selalu
    // kelihatan -- kalau tadinya baris ikon fitur yang lagi dibuka, otomatis
    // gantian balik ke slot ini dulu.
    if(typeof showFeatureBarMode === 'function') showFeatureBarMode('suggest');
    const isError = /ditolak|tidak tersedia|gagal|error/i.test(msg);
    bar.innerHTML = '';
    bar.classList.add('status-mode');
    bar.classList.toggle('status-error', isError);
    bar.classList.toggle('status-ok', !isError);
    const span = document.createElement('span');
    span.className = 'suggest-status-text';
    span.textContent = msg.replace(/<[^>]*>/g, '');
    bar.appendChild(span);
    clearTimeout(statusHideTimer);
    // Ditahan sebentar aja (900ms, bukan 4 detik seperti dulu) -- karena ini
    // sekarang berbagi slot yang sama dengan saran kata, biar tidak lama-lama
    // "merampas" tempat prediksi selagi main gitar cepat (notifikasi baru
    // bakal muncul lagi tiap bunyi kedeteksi, jadi tidak perlu ditahan lama).
    statusHideTimer = setTimeout(()=>{
      bar.classList.remove('status-mode','status-error','status-ok');
      renderSuggestions(); // balik ke saran kata normal, di slot yang sama persis
    }, 900);
  }

  // ---------------- Bridge tambahan: hapus beberapa karakter sekaligus (dipakai saat ganti kata via prediksi) ----------------
  function bridgeDeleteBackwardN(n){
    if(window.AndroidKeyboard && window.AndroidKeyboard.deleteBackwardN){
      try{ window.AndroidKeyboard.deleteBackwardN(n); return; }catch(e){}
    }
    // Fallback kalau bridge lama belum punya deleteBackwardN: panggil deleteBackward berkali-kali.
    for(let i=0;i<n;i++) bridgeDeleteBackward();
  }

  // ---------------- Fitur 1: Prediksi kata / saran ketikan (banyak bahasa + belajar otomatis) ----------------
  // Setiap bahasa punya daftar kata umum (urut dari yang paling sering dipakai) + kata pembuka kalimat.
  // Ini kamus ringkas bawaan (offline), BUKAN kamus raksasa seperti milik Gboard -- untuk menambah
  // bahasa baru cukup tambah satu entri di LANGS. Kata yang kamu ketik sendiri dipelajari otomatis
  // per bahasa (kamus pribadi), jadi makin lama makin pas.
  // Pencocokan tidak peka aksen: ketik "cafe" -> disarankan "café" (cara mengetik huruf beraksen).
  const LANGS = {
    id:{ name:'Bahasa Indonesia', tag:'ID', starters:['Saya','Aku','Halo'], fill:['yang','dan','di'],
      nx:{ saya:'ingin mau tidak sudah', aku:'mau sudah tidak', kamu:'mau sudah lagi', kita:'bisa harus akan', mereka:'sudah akan tidak',
           yang:'ada sudah paling', di:'sini mana rumah', ke:'sana mana rumah', dengan:'baik cara saya', untuk:'saya kamu itu',
           tidak:'bisa ada tahu', sudah:'makan selesai tidak', belum:'ada tahu selesai', terima:'kasih', selamat:'pagi siang malam',
           apa:'kabar yang itu', bagaimana:'kabar cara kalau', kenapa:'tidak kamu bisa', kalau:'kamu tidak begitu', nanti:'malam ya saya',

  const LANG_KEY = 'genjreng_lang', LANGS_KEY = 'genjreng_langs';
  // Bahasa yang diaktifkan (muncul di pilihan cepat: tahan spasi) & bahasa yang sedang dipakai.
  let enabledLangs = ['id','en'];
  try{
    const s = JSON.parse(localStorage.getItem(LANGS_KEY) || 'null');
    if(Array.isArray(s)){ const f = s.filter(c => LANGS[c]); if(f.length) enabledLangs = f; }
  }catch(e){}
  let currentLang = enabledLangs[0];
  try{ const c = localStorage.getItem(LANG_KEY); if(c && LANGS[c] && enabledLangs.includes(c)) currentLang = c; }catch(e){}

  // ---- Pencocokan kata: tanpa aksen + toleran salah ketik (tuts bertetangga di QWERTY lebih murah) ----
  function deaccent(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/ı/g,'i'); }
  const _dictCache = {};
  function getDict(lang){
    if(!_dictCache[lang]){
      _dictCache[lang] = [...new Set(LANGS[lang].w.split(/\s+/).filter(Boolean))].map((w,i)=>({ w, d:deaccent(w), r:i }));
    }
    return _dictCache[lang];
  }
  const KB_ROWS = ['qwertyuiop','asdfghjkl','zxcvbnm'], KB_OFF = [0,.25,.75], KB_POS = {}, KB_NEAR = {};
  KB_ROWS.forEach((row, ri)=> [...row].forEach((c, ci)=>{ KB_POS[c] = [ci + KB_OFF[ri], ri]; }));
  // Pasangan tuts bersebelahan dihitung sekali di awal (dipakai ribuan kali per ketukan).
  for(const p in KB_POS) for(const q in KB_POS){
    const dx = KB_POS[p][0]-KB_POS[q][0], dy = KB_POS[p][1]-KB_POS[q][1];
    if(p !== q && dx*dx + dy*dy <= 1.7) KB_NEAR[p+q] = true;
  }
  const keyNear = (a, b) => KB_NEAR[a+b] === true;
  // Jarak edit berbobot (Damerau-Levenshtein). Larik dipakai ulang (tanpa alokasi) supaya ringan di HP lawas.
  const _ec0 = new Float32Array(40), _ec1 = new Float32Array(40), _ec2 = new Float32Array(40);
  function editCost(a, b){
    const n = a.length, m = b.length;
    if(n > 38 || m > 38) return 99;
    let prev2 = _ec0, prev = _ec1, cur = _ec2;
    for(let j=0;j<=m;j++) prev[j] = j;
    for(let i=1;i<=n;i++){
      cur[0] = i;
      const ca = a[i-1];
      for(let j=1;j<=m;j++){
        const cb = b[j-1];
        const sub = ca === cb ? 0 : (KB_NEAR[ca+cb] === true ? 0.5 : 1);
        let v = prev[j] + 1;
        const ins = cur[j-1] + 1; if(ins < v) v = ins;
        const rep = prev[j-1] + sub; if(rep < v) v = rep;
        if(i>1 && j>1 && ca === b[j-2] && a[i-2] === cb){ const tr = prev2[j-2] + 0.7; if(tr < v) v = tr; }
        cur[j] = v;
      }
      const t = prev2; prev2 = prev; prev = cur; cur = t;
    }
    return prev[m];
  }
  // Salah ketik hampir selalu mempertahankan huruf pertama (atau tertukar / bersebelahan) -> saring dulu, hemat CPU.
  function firstLetterPlausible(t, w){
    return t[0] === w[0] || KB_NEAR[t[0]+w[0]] === true || (t.length > 1 && w.length > 1 && t[0] === w[1] && t[1] === w[0]);
  }

  // ---- Kamus pribadi: belajar sendiri dari kata yang kamu ketik, persis Gboard ----

  const LEARN_KEY = 'genjreng_learned_words_v1';
  const BIGRAM_KEY = 'genjreng_bigrams_v1';
  let learnedWords = {}, bigrams = {};
  try{ learnedWords = JSON.parse(localStorage.getItem(LEARN_KEY) || '{}'); }catch(e){ learnedWords = {}; }
  try{ bigrams = JSON.parse(localStorage.getItem(BIGRAM_KEY) || '{}'); }catch(e){ bigrams = {}; }
  if(!learnedWords[currentLang]) learnedWords[currentLang] = {};
  if(!bigrams[currentLang]) bigrams[currentLang] = {};
  let lastCompletedWord = '';

  // Kolom privat (password / mode incognito / IME_FLAG_NO_PERSONALIZED_LEARNING).

  let saveLearnTimer = null;
  function persistLearning(){
    // Debounce ringan (150ms) supaya tidak nulis ke localStorage tiap huruf,
    // cukup sesaat setelah tiap kata selesai — tetap terasa instan buat user.
    clearTimeout(saveLearnTimer);
    saveLearnTimer = setTimeout(()=>{
      try{ localStorage.setItem(LEARN_KEY, JSON.stringify(learnedWords)); }catch(e){}
      try{ localStorage.setItem(BIGRAM_KEY, JSON.stringify(bigrams)); }catch(e){}

  }
  function learnWord(word){
    if(privateField) return;   // jangan pernah belajar dari kolom password/incognito
    const w = (word||'').trim();
    if(!isLearnable(w)) return;   // saring kata kepanjangan / kependekan / asal-ulang ("aaaa", "hahaha") -- tidak disimpan
    const lower = w.toLowerCase();
    if(blocked[currentLang] && blocked[currentLang][lower]){ delete blocked[currentLang][lower]; saveBlocked(); }   // diketik lagi dengan sengaja
    const bucket = learnedWords[currentLang];
    if(!bucket[lower]) bucket[lower] = {count:0, last:0, disp:w};
    bucket[lower].count += 1;
    bucket[lower].last = Date.now();
    bucket[lower].disp = w; // simpan kapitalisasi terakhir (mis. nama, awal kalimat)
    // Batasi kamus pribadi ke ±800 kata paling sering, biar tidak membengkak selamanya.
    const keys = Object.keys(bucket);
    if(keys.length > 800){
      keys.sort((a,b)=> bucket[a].count - bucket[b].count);
      delete bucket[keys[0]];
    }
    if(lastCompletedWord){
      const bg = bigrams[currentLang];
      if(!bg[lastCompletedWord]) bg[lastCompletedWord] = {};
      bg[lastCompletedWord][lower] = (bg[lastCompletedWord][lower]||0) + 1;
      // Yang disimpan cuma PASANGAN 2 kata (bukan kalimat): tiap kata paling banyak 8 pasangannya, total ±1500 kata awal.
      const seconds = Object.keys(bg[lastCompletedWord]);
      if(seconds.length > 8){
        seconds.sort((a,b)=> bg[lastCompletedWord][a] - bg[lastCompletedWord][b]);
        delete bg[lastCompletedWord][seconds[0]];

  // Kata = huruf/angka/apostrof/tanda hubung berurutan tepat sebelum kursor (tanda baca memutus kata).
  const WORD_CH = /[\p{L}\p{M}\p{N}'’-]/u;
  function getCurrentWordRange(){
    let start = cursorPos;

    while(start < cursorPos && /['’-]/.test(text[start])) start++;   // kutip/strip di awal bukan bagian kata

  // Hasil saran untuk kata yang sedang diketik: kamus pribadi > awalan kamus > koreksi salah ketik.
  function computeWordSuggestions(word){
    if(/\d/.test(word)) return [];
    const typedD = deaccent(word);
    const len = typedD.length;
    const typedLower = word.toLowerCase();
    const cands = new Map();
    const push = (disp, score)=>{
      const key = disp.toLowerCase();
      if(key === typedLower || disp.length > 18 || isBlocked(disp)) return;   // kepanjangan / sudah dihapus pengguna -> tidak ditampilkan
      const cur = cands.get(key);
      if(!cur || cur.s < score) cands.set(key, { w:disp, s:score });
    };
    const now = Date.now();
    const bucket = learnedWords[currentLang] || {};
    for(const k in bucket){
      const e = bucket[k]; if(!e) continue;
      const kd = deaccent(k);
      if(kd.startsWith(typedD) && kd !== typedD){
        const ageDays = (now - (e.last||0)) / 86400000;
        push(e.disp || k, 900 + Math.min(e.count,50)*4 - Math.min(ageDays,30));
      }
    }
    const dict = getDict(currentLang);
    // Kalau kata yang diketik SUDAH kata valid (kamus / kamus pribadi), jangan tawarkan koreksi mirip-mirip.
    const known = dict.some(e => e.d === typedD) || Object.keys(bucket).some(k => deaccent(k) === typedD);
    for(let i=0;i<dict.length;i++){
      const e = dict[i];
      if(e.d.startsWith(typedD)){
        if(e.d !== typedD) push(e.w, 800 - e.r*0.3 - (e.d.length-len)*6);
        continue;
      }
      if(!known && len >= 3 && Math.abs(e.d.length - len) <= 3 && firstLetterPlausible(typedD, e.d)){
        const maxCost = len <= 4 ? 1.2 : 2.2;
        let c = editCost(typedD, e.d);
        if(e.d.length > len){   // orang belum selesai mengetik: bandingkan juga dengan awalan kata
          c = Math.min(c, editCost(typedD, e.d.slice(0,len)) + 0.3, editCost(typedD, e.d.slice(0,len+1)) + 0.3);
        }
        if(c <= maxCost) push(e.w, 700 - c*120 - e.r*0.15);
      }
    }
    return [...cands.values()].sort((a,b)=> b.s - a.s).slice(0, 4).map(c => c.w);
  }
  // Samakan huruf besar/kecilnya dengan yang sedang diketik ("Ca" -> "Cara", "GB" -> "GBOARD").
  function applyCase(w, typed){
    if(!typed) return w;
    if(typed.length > 1 && typed === typed.toUpperCase() && typed !== typed.toLowerCase()) return w.toUpperCase();
    const f = typed.charAt(0);
    if(f !== f.toLowerCase()) return w.charAt(0).toUpperCase() + w.slice(1);

  }

  function getNextWordCandidates(limit){
    const out = [], seen = new Set();
    const add = w => { const k = w.toLowerCase(); if(!seen.has(k) && !isBlocked(w)){ seen.add(k); out.push(w); } };
    const bg = (bigrams[currentLang] || {})[lastCompletedWord];
    if(bg) Object.keys(bg).sort((a,b)=> bg[b]-bg[a]).slice(0, limit).forEach(add);

    if(nx) nx.split(' ').forEach(add);
    return out.slice(0, limit);
  }

  // ---------------- Preferensi (bisa dimatikan dari kisi alat halaman 2) ----------------
  const PREFS_KEY = 'genjreng_prefs_v1';

  try{ Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS_KEY) || '{}')); }catch(e){}

  // ---------------- Kamus tambahan opsional: www/dict/<kode>.txt (satu kata per baris / dipisah spasi) ----------------
  // Kalau file itu ada, isinya ditambahkan ke kamus bahasa tsb tanpa perlu mengubah index.html.
  const _extraLoaded = {};

  let blocked = {};
  try{ blocked = JSON.parse(localStorage.getItem(BLOCK_KEY) || '{}'); }catch(e){ blocked = {}; }
  function isBlocked(w){ return !!((blocked[currentLang] || {})[String(w).toLowerCase()]); }
  function saveBlocked(){ try{ localStorage.setItem(BLOCK_KEY, JSON.stringify(blocked)); }catch(e){} }
  function removeSuggestion(w){
    const k = String(w).toLowerCase();

    const bg = bigrams[currentLang] || {};
    for(const a in bg){ if(bg[a] && bg[a][k] !== undefined) delete bg[a][k]; if(bg[a] && !Object.keys(bg[a]).length) delete bg[a]; }

  // ---------------- Menyusun teks bahasa non-Latin (composing) ----------------
  var compose = '', composeOut = '', composeStart = 0;
  function scriptLang(){ const L = LANGS[currentLang]; return (L && L.translit) ? L : null; }
  function isComposing(){ return compose.length > 0; }
  function bridgeSetComposing(out, prev){
    const B = window.AndroidKeyboard;
    if(!B) return;
    try{
      if(B.setComposingText){ B.setComposingText(out); return; }
      // Bridge lama tanpa composing: tiru dengan hapus lalu ketik ulang.

    }catch(e){}
  }
  function bridgeFinishComposing(){

  }
  function setComposeOut(out){
    const prev = composeOut;

    bridgeSetComposing(out, prev);
  }
  function composeLetter(ch){

    compose += ch;
    setComposeOut(L.translit(compose, false));

    scheduleSuggestions();
  }
  function composeBackspace(){
    const L = scriptLang();

  // Selesaikan penyusunan: bentuk akhir (mis. ん di ujung kata, ς di ujung kata Yunani), lalu "kunci" teksnya.
  function finishCompose(learn, keepOut){
    if(!compose) return;
    const L = scriptLang();
    if(L && !keepOut){   // keepOut = teks sudah diganti pilihan saran, jangan dihitung ulang dari huruf latin
      const fin = L.translit(compose, true);
      if(fin !== composeOut) setComposeOut(fin);
    }
    bridgeFinishComposing();
    const w = composeOut;
    compose = ''; composeOut = '';
    if(learn !== false) learnWord(w);

  // Pilih saran untuk kata yang sedang disusun: gantikan teks sementara dengan pilihan itu.
  function commitComposeWith(word){
    const L = scriptLang();
    setComposeOut(word);
    if(L && L.noSpace){ finishCompose(true, true); return; }   // Jepang tidak memakai spasi
    finishCompose(false, true);
    appendText(' ');                                     // spasi -> kata ikut dipelajari lewat batas kata
  }
  window.onComposingLost = function(){ compose = ''; composeOut = ''; };   // kursor dipindah / teks diganti aplikasi

  // ---------------- Koreksi otomatis saat spasi/tanda baca (dengan "urungkan" lewat hapus) ----------------
  const AC_TRIGGERS = new Set([' ', '.', ',', '!', '?', ';', ':']);
  var lastAutoCorrect = null;
  function bestCorrection(word){
    const typedD = deaccent(word);
    const dict = getDict(currentLang);
    if(typedD.length < 3 || dict.some(e => e.d === typedD)) return null;   // sudah kata valid
    // Konservatif supaya tidak "menganiaya" kata sah yang belum ada di kamus mini: kata pendek hanya dikoreksi
    // untuk salah-tuts-bersebelahan / huruf tertukar (biaya <= 0.7); tambah/kurang satu huruf baru untuk kata >= 6 huruf.
    const limit = typedD.length >= 6 ? 1.0 : 0.7;
    let best = null;
    for(let i = 0; i < dict.length && i < 2500; i++){                        // hanya kata-kata umum
      const e = dict[i];
      if(Math.abs(e.d.length - typedD.length) > 1 || !firstLetterPlausible(typedD, e.d) || isBlocked(e.w)) continue;
      const c = editCost(typedD, e.d);
      if(c > limit) continue;
      const score = c + Math.log2(e.r + 2) * 0.12;   // makin umum katanya, makin menang ("teh" -> "the", bukan "ten")
      if(!best || score < best.score) best = { w:e.w, c, r:e.r, score };
    }
    return best;
  }
  function tryAutoCorrect(){
    if(!prefs.autocorrect || privateField || mode !== 'letters' || scriptLang()) return null;
    const { start, end, word } = getCurrentWordRange();
    if(!word || !/^\p{L}+$/u.test(word)) return null;
    const rest = word.slice(1);
    if(rest !== rest.toLowerCase()) return null;                             // "iPhone", "GB" -> biarkan
    if(word.charAt(0) !== word.charAt(0).toLowerCase()){                     // diawali huruf besar: nama? hanya koreksi di awal kalimat
      const before = text.slice(0, start);
      if(before && !/(^|[.!?…]["')\]]*\s+|\n)$/.test(before)) return null;
    }
    const bucket = learnedWords[currentLang] || {};
    if(bucket[word.toLowerCase()]) return null;                              // kata milikmu sendiri
    const fix = bestCorrection(word);
    if(!fix) return null;
    return { start, end, word, fixed: applyCase(fix.w, word) };
  }

  function renderSuggestions(){
    const bar = document.getElementById('suggestBar');
    bar.innerHTML = '';
    // Kalau tadinya baris ikon fitur yang lagi dibuka, ketikan baru harus otomatis
    // nampilin saran kata lagi -- gantian balik ke slot ini.
    if(typeof showFeatureBarMode === 'function') showFeatureBarMode('suggest');
    bar.classList.remove('status-mode','status-error','status-ok');
    if(privateField || !prefs.suggest) return;   // kolom privat / saran dimatikan: bar dibiarkan kosong
    const { word } = getCurrentWordRange();
    let candidates = [];
    if(word.length > 0){
      // Persis Gboard: slot kiri = kata yang sedang diketik apa adanya, lalu koreksi/lanjutan terbaik.
      const seen = new Set([word.toLowerCase()]);
      candidates = [word];
      const SLx = scriptLang();
      const extra = (SLx && SLx.extraCandidates && isComposing()) ? SLx.extraCandidates(word) : [];
      for(const w of extra.concat(computeWordSuggestions(word).map(x => applyCase(x, word)))){
        const k = w.toLowerCase();
        if(!seen.has(k)){ seen.add(k); candidates.push(w); }
        if(candidates.length >= 3) break;
      }
    } else {
      const L = LANGS[currentLang];
      const atStart = shiftActive || !lastCompletedWord;   // awal kalimat -> kata pembuka
      let list = getNextWordCandidates(3);
      const seen = new Set(list.map(w => w.toLowerCase()));
      for(const w of (atStart ? L.starters : L.fill).concat(L.fill)){
        if(list.length >= 3) break;
        if(!seen.has(w.toLowerCase()) && !isBlocked(w)){ seen.add(w.toLowerCase()); list.push(w); }
      }
      if(shiftActive) list = list.map(w => w.charAt(0).toUpperCase() + w.slice(1));
      candidates = list.slice(0, 3);
    }
    candidates.forEach((c, idx) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'suggest-chip';
      chip.textContent = c;
      // Ketuk = pakai saran. TAHAN (±0,5 dtk) = hapus saran itu dari kamus. Slot kiri saat sedang
      // mengetik adalah kata yang kamu ketik sendiri, jadi tidak bisa dihapus.
      const canDelete = !(word.length > 0 && idx === 0);
      let timer = null, fired = false, sx = 0, sy = 0;
      const stop = ()=>{ if(timer){ clearTimeout(timer); timer = null; } };
      chip.addEventListener('pointerdown', (e)=>{
        fired = false; sx = e.clientX; sy = e.clientY; stop();
        if(canDelete) timer = setTimeout(()=>{ timer = null; fired = true; if(navigator.vibrate) navigator.vibrate(12); removeSuggestion(c); }, 500);
      });
      chip.addEventListener('pointermove', (e)=>{ if(timer && (Math.abs(e.clientX-sx) > 14 || Math.abs(e.clientY-sy) > 14)) stop(); });
      chip.addEventListener('pointerup', ()=>{ const wasFired = fired; stop(); if(!wasFired) applySuggestion(c); });
      chip.addEventListener('pointercancel', stop);
      chip.addEventListener('pointerleave', stop);
      bar.appendChild(chip);
    });
  }

  function applySuggestion(chosen){
    if(isComposing()){ commitComposeWith(chosen); return; }
    const { start, end, word } = getCurrentWordRange();
    const removeCount = word.length;
    text = text.slice(0, start) + chosen + ' ' + text.slice(end);
    cursorPos = start + chosen.length + 1;
    if(removeCount > 0) bridgeDeleteBackwardN(removeCount);
    bridgeCommit(chosen + ' ');
    learnWord(chosen); // memilih saran pun tetap dihitung "dipakai" -> makin sering muncul di atas
    renderSuggestions();
  }

  // memenuhi panel dan sulit dihapus. Salinan yang lebih panjang dari ini diabaikan (tidak disimpan sama sekali).
  const CLIP_MAX_WORDS = 2, CLIP_MAX_CHARS = 30;
  function isClipSaveable(t){
    if(typeof t !== 'string') return false;
    const s = t.trim();
    if(!s || s.length > CLIP_MAX_CHARS) return false;
    if(/\d/.test(s)) return false;   // ada angka = kemungkinan sandi / kode OTP / nomor -> bukan kosakata, jangan disimpan
    return s.split(/\s+/).length <= CLIP_MAX_WORDS;
  }
  { // bersihkan riwayat lama yang sudah terlanjur menyimpan teks panjang
    const kept = clipboardHistory.filter(isClipSaveable);
    if(kept.length !== clipboardHistory.length){
      clipboardHistory = kept;
      try{ localStorage.setItem('genjreng_clipboard', JSON.stringify(clipboardHistory)); }catch(e){}
    }

  function renderClipboardPanel(){

      panel.appendChild(empty);

    }
    const toolbar = document.createElement('div');

    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'clipboard-clear';
    clearBtn.textContent = 'Hapus semua';
    clearBtn.addEventListener('pointerdown', () => {
      clipboardHistory = [];
      saveClipboardHistory();
      renderClipboardPanel();
    });
    toolbar.appendChild(clearBtn);
    panel.appendChild(toolbar);

    clipboardHistory.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'clipboard-item-row';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'clipboard-item';

  // Dipanggil dari sisi Java (HtmlKeyboardService) setiap kali clipboard sistem Android berubah.
  window.onClipboardChanged = function(newText, sensitive){

    newText = newText.trim();

    clipboardHistory = clipboardHistory.filter(t => t !== newText);

    saveClipboardHistory();

  };

  //     yang perlu ditambah di HtmlKeyboardService.java, yang di baliknya
  //     manggil API terjemahan lewat internet), lalu tampilkan hasilnya di sini.
  const MINI_DICT_ID_EN = {
    'saya':'i','kamu':'you','aku':'i','dia':'he/she','kita':'we','kami':'we','mereka':'they',
    'ini':'this','itu':'that','yang':'which','dan':'and','atau':'or','tapi':'but','karena':'because',
    'jika':'if','akan':'will','sudah':'already','belum':'not yet','tidak':'not','bukan':'not',
    'boleh':'may','harus':'must','bisa':'can','mau':'want','ingin':'want','suka':'like','cinta':'love',
    'baik':'good','bagus':'good','besar':'big','kecil':'small','banyak':'many','sedikit':'a little',
    'apa':'what','siapa':'who','kapan':'when','dimana':'where','kenapa':'why','mengapa':'why',
    'iya':'yes','oke':'okay','terima kasih':'thank you','maaf':'sorry','tolong':'please',
    'selamat pagi':'good morning','selamat malam':'good night','sekarang':'now','besok':'tomorrow',
    'kemarin':'yesterday','gitar':'guitar','musik':'music','lagu':'song','nada':'note','main':'play',
    'rumah':'house','makan':'eat','minum':'drink','tidur':'sleep','pergi':'go','datang':'come',
    'cepat':'fast','lambat':'slow','pelan':'slow','kirim':'send','buka':'open','tutup':'close',
    'aplikasi':'application','baru':'new','lama':'old'

  const MINI_DICT_EN_ID = Object.fromEntries(Object.entries(MINI_DICT_ID_EN).map(([id,en])=>[en,id]));

  function translateText(str, from, to){
    if(window.AndroidKeyboard && window.AndroidKeyboard.translateText){
      try{ return window.AndroidKeyboard.translateText(str, from, to); }catch(e){}
    }
    const dict = (from==='id' && to==='en') ? MINI_DICT_ID_EN
               : (from==='en' && to==='id') ? MINI_DICT_EN_ID : null;
    if(!dict || !str.trim()) return str;
    return str.trim().split(/\s+/).map(w=>{
      const clean = w.toLowerCase().replace(/[.,!?]/g,'');
      return dict[clean] || w;
    }).join(' ');
  }
