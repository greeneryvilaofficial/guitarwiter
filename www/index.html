  emojiPanelEl.insertBefore(emojiBackBtn, emojiPanelEl.firstChild);

  // Tombol hapus juga ditaruh di dalam panel emoji dengan alasan yang sama:
  // supaya tidak perlu kembali ke huruf dulu hanya untuk menghapus.
  const emojiDeleteBtn = document.createElement('button');
  emojiDeleteBtn.type = 'button';
  emojiDeleteBtn.className = 'emoji-btn emoji-back-btn';
  emojiDeleteBtn.innerHTML = '<span class="ch">⌫</span><span class="tag">Hapus</span>';
  emojiDeleteBtn.addEventListener('pointerdown', () => { flash(emojiDeleteBtn); backspace(); });
  wireLongPressRepeat(emojiDeleteBtn, backspace); // tahan = hapus berulang & makin cepat, sama seperti tuts hapus utama
  emojiPanelEl.insertBefore(emojiDeleteBtn, emojiPanelEl.firstChild);

  function setMode(newMode){
    mode = newMode;
    keyboardEl2.style.display = (mode==='emoji') ? 'none' : '';
    emojiPanelEl.style.display = (mode==='emoji') ? 'grid' : 'none';
    // Baris angka cuma ditampilkan di mode simbol (?123), sama seperti Gboard --
    // di mode huruf, angkanya "di belakang" lewat badge pojok + tekan-tahan.
    keyboardEl.classList.toggle('show-num-row', mode==='symbols');
    applySymbolMode(mode==='symbols');
    numBtnEl.querySelector('.ch').textContent = (mode==='symbols') ? 'ABC' : '?123';
    { const ec = emojiBtnEl.querySelector('.ch'); if(mode==='emoji') ec.textContent = 'ABC'; else ec.innerHTML = ICONS.emoji; }
    if(mode==='symbols'){
      showStatus(listening ? 'Mode simbol aktif — petik nada untuk mengetik tanda baca.' : 'Mode simbol aktif — lihat nada di bawah tiap tanda baca.');
    } else if(mode==='emoji'){
      showStatus(listening ? 'Mode emoji aktif — petik nada untuk mengetik emoji.' : 'Mode emoji aktif — lihat nada di bawah tiap emoji.');
    } else {
      showStatus(listening ? 'Mendengarkan… petik satu nada per satu.' : 'Petik nada satu-satu (bukan kunci penuh) untuk hasil terbaik.');
    }
  }

  // ---------------- Tekan-tahan tuts q-p buat ambil angka pojok (persis Gboard) ----------------
  const LONG_PRESS_MS = 300;         // ambang lama tekan sebelum dianggap "tahan"
  const LONG_PRESS_MOVE_TOLERANCE = 18; // px -- geser lebih dari ini sebelum ambang = batal (ketarik keluar)

  function wireLongPressNumber(btn){
    // RESPONSIF: huruf diketik SAAT JARI MENYENTUH (pointerdown), tidak menunggu jari
    // diangkat. Kalau jari tetap menahan sampai LONG_PRESS_MS, huruf tadi dihapus
    // lalu diganti angka pojok (persis hasil akhirnya seperti Gboard).
    let timer = null;
    let startX = 0, startY = 0;

    function clearTimer(){ if(timer){ clearTimeout(timer); timer = null; } }

    btn.addEventListener('pointerdown', (e)=>{
      startX = e.clientX; startY = e.clientY;
      clearTimer();
      manualPress(btn);                      // huruf langsung masuk, tanpa jeda
      timer = setTimeout(()=>{
        timer = null;
        btn.classList.add('key-longpress-num');
        const num = btn.dataset.cornerNum;
        backspace();                         // hapus huruf yang barusan diketik
        showBubble(btn, num);
        appendText(num);
        if(navigator.vibrate) navigator.vibrate(8);
      }, LONG_PRESS_MS);
    });
    btn.addEventListener('pointermove', (e)=>{
      if(timer==null) return;
      if(Math.abs(e.clientX-startX) > LONG_PRESS_MOVE_TOLERANCE || Math.abs(e.clientY-startY) > LONG_PRESS_MOVE_TOLERANCE){
        clearTimer();                        // jari bergeser: batal jadi angka, huruf tetap
      }
    });
    function end(){
      clearTimer();
      btn.classList.remove('key-longpress-num');
    }
    btn.addEventListener('pointerup', end);
    btn.addEventListener('pointercancel', end);
    btn.addEventListener('pointerleave', end);
  }

  // ---------------- Tekan-tahan Backspace: hapus berulang & makin cepat (persis Gboard) ----------------
  // Gboard: tekan sebentar = hapus 1 karakter (sudah terjadi lewat pointerdown biasa).
  // Tahan = mulai mengulang otomatis setelah jeda awal, lalu makin cepat makin lama ditahan,
  // sampai akhirnya ngebut di interval tercepat -- bukan interval tetap dari awal.
  function wireLongPressRepeat(btn, action){
    const INITIAL_DELAY_MS = 420;   // jeda sebelum mulai berulang otomatis
    const START_INTERVAL_MS = 110;  // interval berulang di awal
    const MIN_INTERVAL_MS = 28;     // interval tercepat setelah dipercepat penuh
    const ACCEL_MS = 900;           // durasi tahan sampai interval mencapai kecepatan tercepat
    let repeatTimer = null;
    let startedAt = 0;
    let active = false;

    function scheduleNext(){
      const held = performance.now() - startedAt;
      const t = Math.min(1, held / ACCEL_MS);
      const interval = START_INTERVAL_MS + (MIN_INTERVAL_MS - START_INTERVAL_MS) * t;
      repeatTimer = setTimeout(()=>{
        if(!active) return;
        action();
        scheduleNext();
      }, interval);
    }
    function stop(){
      active = false;
      if(repeatTimer){ clearTimeout(repeatTimer); repeatTimer = null; }
    }
    btn.addEventListener('pointerdown', ()=>{
      stop();
      active = true;
      startedAt = performance.now();
      repeatTimer = setTimeout(()=>{
        if(!active) return;
        scheduleNext();
      }, INITIAL_DELAY_MS);
    });
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('pointerleave', stop);
  }

  // ---------------- Key actions (silent — no internal synthesized audio) ----------------
  function manualPress(el){
    flash(el);
    let ch;
    if(mode==='symbols' && el.dataset.symbolChar){
      ch = el.dataset.symbolChar;
    } else {
      const base = el.dataset.origChar;
      ch = (shiftActive && /^[a-z]$/.test(base)) ? base.toUpperCase() : base;
      if(shiftActive && !capsLock){ shiftActive=false; updateShiftVisual(); }
    }
    showBubble(el, ch);
    appendText(ch);
  }
  function functionalPress(el){
    flash(el);
    const type = el.dataset.type;
    if(type==='backspace'){ showBubble(el,'⌫'); backspace(); }
    else if(type==='enter'){ showBubble(el,'↵'); pressEnter(); }
    else if(type==='literal'){ const c = el.dataset.char; showBubble(el, c===' '?'␣':c); appendText(c); }
  }
  // BARU: dipanggil kalau ada tap/ketukan badan gitar (bunyi keras tapi tidak
  // periodik sama sekali). Cari tombol spasi di layout biar dapat feedback
  // visual (kedip tombol + bubble) sama seperti tuts lain yang diketuk lewat
  // nada, lalu ketik spasi lewat jalur yang sama (appendText -> bridgeCommit)
  // yang dipakai autoTypeNote(). HARUS konsisten dengan onPercussiveTap() di
  // NativeMicPitchDetector.java.
  function typePercussiveTapAsSpace(){
    const spaceEl = allKeys.find(el => el && el.dataset && el.dataset.type === 'literal' && el.dataset.char === ' ');
    if(spaceEl){ flash(spaceEl); showBubble(spaceEl, '␣'); }
    appendText(' ');
    showStatus('🥁 Tap terdeteksi → <b>"␣"</b> (spasi)');
  }

  function autoTypeNote(idx){
    if(mode==='emoji'){
      const el = emojiKeys[idx];
      if(!el) return null;
      flash(el);
      const emo = el.dataset.emoji;
      showBubble(el, emo);
      appendText(emo);
      return emo;
    }

    const el = allKeys[idx];
    if(!el) return null;
    const type = el.dataset.type;

    if(type==='note'){
      flash(el);
      const base = el.dataset.origChar;
      let ch;
      if(mode==='symbols' && el.dataset.symbolChar){
        ch = el.dataset.symbolChar;
      } else {
        ch = (shiftActive && /^[a-z]$/.test(base)) ? base.toUpperCase() : base;
      }
      showBubble(el, ch);
      appendText(ch);
      if(mode!=='symbols' && shiftActive && !capsLock){ shiftActive=false; updateShiftVisual(); }
      return ch;
    } else if(type==='literal'){
      flash(el);
      const c = el.dataset.char;
      showBubble(el, c===' ' ? '␣' : c);
      appendText(c);
      return c;
    } else if(type==='backspace'){
      flash(el); showBubble(el,'⌫'); backspace();
      return '⌫';
    } else if(type==='enter'){
      flash(el); showBubble(el,'↵'); pressEnter();
      return '\n';
    } else if(el.id==='shiftBtn'){
      shiftToggle(el);
      showBubble(el, capsLock ? 'CAPS' : (shiftActive ? '⇧ ON' : '⇧'));
      return '⇧';
    } else if(el.id==='emojiBtn'){
      flash(el);
      setMode(mode==='emoji' ? 'letters' : 'emoji');
      showBubble(el, mode==='emoji' ? '😊' : 'ABC');
      return '😊';
    } else if(el.id==='numBtn'){
      flash(el);
      setMode(mode==='symbols' ? 'letters' : 'symbols');
      showBubble(el, mode==='symbols' ? '?123' : 'ABC');
      return '?123';
    }
    return null;
  }

  // ---------------- Mic: jalur NATIVE (AudioRecord Java), PRIORITAS UTAMA ----------------
  // getUserMedia() di WebView gagal terus di sebagian HP (NotAllowedError) meski izin
  // sistem sudah "Diizinkan" -- kemungkinan pembatasan WebView/OEM yang di luar jangkauan
  // kode web. Kalau window.AndroidKeyboard.startNativeMic tersedia (artinya berjalan di
  // dalam APK asli), pakai jalur ini: rekam + deteksi nada dilakukan di kode Java native
  // (lihat NativeMicPitchDetector.java), hasilnya langsung dikirim ke sini secara instan.
  function hasNativeMicBridge(){
    return !!(window.AndroidKeyboard && window.AndroidKeyboard.startNativeMic);
  }

  window.onNativeMicStatus = function(kind, ok){
    if(kind === 'permission' && !ok){
      showStatus('❌ Izin mikrofon belum aktif. Buka aplikasi Guitarwiter dari app drawer sekali, izinkan mikrofonnya, lalu coba lagi.');
      listening = false;
      micToolBtn.classList.remove('on');
      return;
    }
    if(kind === 'listening'){
      showStatus('🎙️ Mendengarkan… petik satu nada.');
    } else if(kind === 'onset'){
      showStatus('Mendengar petikan…');
    }
  };
  window.onNativePitchIndex = function(idx, freq){
    if(idx>=0 && idx<NOTE_COUNT){
      const typed = autoTypeNote(idx);
      const noteName = NOTES[idx].name;
      const label = (typed===' ') ? '␣' : (typed==='\n' ? '↵' : typed);
      showStatus('Nada <b>'+noteName+'</b> ('+Math.round(freq)+' Hz) → <b>"'+label+'"</b>');
    }
  };
  window.onNativeOutOfRange = function(freq){
    showStatus('Nada di luar jangkauan '+NOTES[0].name+'–'+NOTES[NOTE_COUNT-1].name+' ('+Math.round(freq)+' Hz).');
  };
  window.onNativeUnclear = function(){
    showStatus('Nada belum terdeteksi jelas, coba petik lagi.');
  };
  // BARU: tap/ketukan ke badan gitar (bunyi keras tapi SAMA SEKALI tidak
  // periodik, beda dari nada yang cuma ambigu di batas kategori) -- dianggap
  // gestur sengaja, langsung ketik spasi. HARUS konsisten dengan
  // onPercussiveTap() di NativeMicPitchDetector.java / HtmlKeyboardService.java.
  window.onNativePercussiveTap = function(){
    typePercussiveTapAsSpace();
  };

  // ---------------- Mic: monophonic pitch detection (autocorrelation) ----------------
  let listening=false, micCtx=null, analyser=null, stream=null, rafId=null;
  // state: 'idle' (siap deteksi onset baru) -> 'sampling' (lagi mengukur nada) ->
  // 'releasing' (nunggu senar benar-benar mereda) -> balik ke 'idle'.
  let state='idle', sampleAt=0, cooldownUntil=0, smoothedRms=0.001;
  let sampleTries=0;
  let onsetPeakRms = 0.001; // puncak RMS sejak onset -- lihat TAP_DECAY_RATIO
  // BARU: lihat penjelasan lengkap di TAP_DECAY_RATIO NativeMicPitchDetector.java.
  // HARUS sama persis dengan TAP_DECAY_RATIO & STRONG_PROBABILITY di sana.
  const TAP_DECAY_RATIO = 0.30;
  const STRONG_PROBABILITY = 0.80;
  // Konsensus multi-bacaan (persis cara tuner "pro" bekerja): sebelum ini,
  // begitu SATU bacaan lolos ambang confidence langsung dikunci -- itu bikin
  // rawan ketuker kalau kebetulan satu bacaan itu meleset. Sekarang minta
  // beberapa bacaan BERTURUT-TURUT yang SEPAKAT (idx sama) dulu baru dikunci.
  let candidateIdx = -1, candidateCount = 0;
  // requiredConfirm sekarang ADAPTIF per bacaan (lihat isCategorySafe() &
  // pemakaiannya di micLoop()), bukan angka tetap lagi.
  // Ambang deteksi "ada petikan baru". HARUS sama persis dengan ONSET_RMS &
  // ONSET_RATIO di NativeMicPitchDetector.java.
  const ONSET_RMS = 0.012;
  const ONSET_RATIO = 1.6;
  // BARU -- fix "nada cepat/tapping ketimpa dengungan nada sebelumnya jadi
  // gak kepick": lihat penjelasan lengkap di RETRIGGER_RATIO
  // NativeMicPitchDetector.java. HARUS sama persis dengan RETRIGGER_RATIO &
  // RETRIGGER_MIN_RMS di sana.
  const RETRIGGER_RATIO = 1.7;
  const RETRIGGER_MIN_RMS = 0.012;
  // BARU (fix "satu strum/petik kebaca berkali-kali jadi huruf dobel/triple"):
  // lihat penjelasan lengkap di RETRIGGER_WINDOW_HOPS NativeMicPitchDetector.java.
  // Intinya: retrigger sekarang dibandingkan ke titik PALING PELAN dalam
  // beberapa frame terakhir (harus ada "lembah" beneran dulu), bukan cuma satu
  // frame sebelumnya -- supaya beating/riak dari SATU strum yang sama tidak
  // kehitung berkali-kali sebagai huruf berbeda-beda. HARUS sama persis dengan
  // RETRIGGER_WINDOW_HOPS, MIN_RETRIGGER_GAP_MS, RELEASE_CONFIRM_HOPS di
  // NativeMicPitchDetector.java.
  const RETRIGGER_WINDOW_HOPS = 5;
  const MIN_RETRIGGER_GAP_MS = 110;
  const RELEASE_CONFIRM_HOPS = 3;
  const recentHopRms = new Array(RETRIGGER_WINDOW_HOPS).fill(0.001);
  let recentHopIdx = 0;
  let lastOnsetAt = 0;
  let releaseBelowCount = 0;
  // Diturunkan lagi dari 140 -> 70: sesudah RETRIGGER ditambahkan (lihat di
  // bawah), COOLDOWN_MS ini cuma perlu jadi debounce MINIMAL buat mencegah
  // riak/jitter di dalam transien satu petikan yang sama kehitung dobel --
  // bukan lagi penjaga utama jarak antar-nada (itu sekarang tugas
  // RETRIGGER_RATIO + RELEASE_RMS). HARUS sama persis dengan COOLDOWN_MS di
  // NativeMicPitchDetector.java.
  const COOLDOWN_MS = 70;
  // PENTING (fix "kedeteksi ganda / dobel ketikan"): dulu, begitu COOLDOWN_MS
  // lewat, sistem langsung siap mendeteksi onset baru lagi -- padahal senar
  // gitar yang baru dipetik itu MASIH BERDENGUNG jauh lebih lama dari 180ms.
  // Kalau dengungannya sempat naik-turun (beating antar harmonik, getaran
  // senar lain yang ikut bergetar simpatik, dst), itu bisa kebaca sebagai
  // "petikan baru" walau sebenarnya masih nada yang sama -> jadi ketikan dobel
  // dari satu kali petik.
  //
  // Perbaikan: sesudah komit, sistem WAJIB nunggu RMS-nya turun di bawah
  // RELEASE_RMS dulu (bukan cuma nunggu waktu) baru boleh siap deteksi onset
  // baru lagi -- persis seperti "note off" di synth, bukan cuma timer. Kalau
  // dengungannya memang lama sekali (mis. senar terbuka dibiarkan berbunyi),
  // MAX_RELEASE_WAIT_MS jadi jaring pengaman supaya tidak macet permanen.
  // Diturunkan dari 0.018 -> 0.012, SEIRING dengan ONSET_RMS yang juga
  // diturunkan di micLoop() (biar ambang "mulai bunyi" & "sudah reda"
  // sama-sama lebih sensitif ke petikan pelan). HARUS sama persis dengan
  // RELEASE_RMS & MAX_RELEASE_WAIT_MS di NativeMicPitchDetector.java.
  const RELEASE_RMS = 0.012;
  const MAX_RELEASE_WAIT_MS = 1500;
  let releaseWaitUntil = 0;

  function freqToMidi(freq){ return 69 + 12*Math.log2(freq/440); }
  // BARU -- fix "satu fret satu nada harus akurat": lihat penjelasan lengkap
  // di calibrationOffsetCents NativeMicPitchDetector.java. HARUS sama persis
  // logikanya dengan sana.
  let calibrationOffsetCents = 0;
  function freqToIdx(freq){ return Math.round(freqToMidi(freq)) - BASE_MIDI; }

  function commitDetectedNote(freq){
    const idx = freqToIdx(freq);
    if(idx>=0 && idx<NOTE_COUNT){
      const typed = autoTypeNote(idx);
      const noteName = NOTES[idx].name;
      const label = (typed===' ') ? '␣' : (typed==='\n' ? '↵' : typed);
      showStatus('Nada <b>'+noteName+'</b> ('+freq.toFixed(0)+' Hz) → <b>"'+label+'"</b>');
    } else {
      showStatus('Nada di luar jangkauan '+NOTES[0].name+'–'+NOTES[NOTE_COUNT-1].name+' ('+freq.toFixed(0)+' Hz).');
    }
  }

  // Mengembalikan {freq, clarity} atau null. "clarity" (0..1) mengukur seberapa
  // periodik sinyalnya — dekat 1 berarti nada tunggal yang bersih (senar dipetik
  // jelas), rendah berarti kemungkinan besar noise/dengung/lebih dari satu senar
  // berbunyi bareng. Nilai ini dipakai buat nyaring hasil yang meragukan supaya
  // huruf yang terketik gak salah-salah lagi.
  // Batas frekuensi yang masuk akal buat dicari (rentang nada gitar yang dipetakan
  // ke tuts, dikasih sedikit margin di kedua ujung). Membatasi rentang pencarian
  // begini bukan cuma bikin lebih cepat (jauh lebih sedikit "tau" yang dicek
  // dibanding menyisir seluruh buffer), tapi juga bikin YIN lebih tegas — dia
  // gak akan pernah mempertimbangkan periode yang jelas-jelas di luar jangkauan
  // gitar sebagai kandidat nada.
  const MIN_VALID_FREQ = 440 * Math.pow(2, (BASE_MIDI - 3 - 69) / 12);
  const MAX_VALID_FREQ = 440 * Math.pow(2, (BASE_MIDI + NOTE_COUNT - 1 + 3 - 69) / 12);

  /**
   * Deteksi pitch pakai algoritma YIN (De Cheveigné & Kawahara, 2002) —
   * dipakai juga di tuner-tuner gitar profesional. Bedanya sama autokorelasi
   * biasa: YIN pakai "cumulative mean normalized difference function" yang
   * secara struktural jauh lebih tahan salah pilih oktaf (misalnya F2 kebaca
   * F3 karena harmonik ke-2 gitar sering lebih kuat dari nada dasarnya sendiri
   * — autokorelasi polos gampang kejebak di situ, YIN jauh lebih jarang).
   * Return {freq, probability} kalau yakin, atau null kalau sinyalnya
   * kurang periodik/kurang jelas (noise, senar teredam, dll).
   */
  function yinDetect(buf, sampleRate){
    const SIZE = buf.length;
    let rms=0;
    for(let i=0;i<SIZE;i++) rms += buf[i]*buf[i];
    rms = Math.sqrt(rms/SIZE);
    // Diturunkan dari 0.012 -> 0.007, sinkron dengan ONSET_RMS di micLoop() --
    // supaya petikan pelan (fingerstyle/palm mute/senar tipis) yang sudah
    // lolos jadi onset tidak langsung ditolak lagi di sini. HARUS sama
    // persis dengan YIN_MIN_RMS di NativeMicPitchDetector.java.
    if(rms < 0.007) return null;

    const minTau = Math.max(2, Math.floor(sampleRate / MAX_VALID_FREQ));
    const maxTau = Math.min(Math.floor(SIZE/2) - 1, Math.ceil(sampleRate / MIN_VALID_FREQ));
    if(maxTau <= minTau) return null;

    // Langkah 1: fungsi selisih d(tau) = jumlah (x[j]-x[j+tau])^2, cuma dihitung
    // untuk rentang tau yang relevan (hemat -- gak perlu hitung tau di luar jangkauan gitar).
    const diff = new Float32Array(maxTau + 1);
    for(let tau=minTau; tau<=maxTau; tau++){
      let sum=0;
      for(let j=0; j<SIZE-maxTau; j++){
        const d = buf[j]-buf[j+tau];
        sum += d*d;
      }
      diff[tau]=sum;
    }

    // Langkah 2: cumulative mean normalized difference function (CMNDF) —
    // inti dari YIN yang bikin dia jauh lebih tegas milih periode fundamental
    // dibanding cuma lihat puncak korelasi mentah seperti autokorelasi biasa.
    const cmnd = new Float32Array(maxTau + 1);
    let runningSum = 0;
    cmnd[minTau] = 1;
    for(let tau=minTau+1; tau<=maxTau; tau++){
      runningSum += diff[tau];
      cmnd[tau] = diff[tau] * (tau - minTau) / (runningSum || 1e-9);
    }

    // Langkah 3: cari tau TERKECIL (frekuensi tertinggi yang valid) yang CMNDF-nya
    // sudah di bawah ambang batas -- ini cara YIN menghindari salah pilih oktaf
    // ke bawah (keliru mengunci ke 2x periode/setengah frekuensi asli).
    const THRESHOLD = 0.15;
    let tauEstimate = -1;
    for(let tau=minTau+1; tau<=maxTau; tau++){
      if(cmnd[tau] < THRESHOLD){
        while(tau+1<=maxTau && cmnd[tau+1] < cmnd[tau]) tau++; // turun ke lembah lokalnya
        tauEstimate = tau;
        break;
      }
    }
    if(tauEstimate === -1) return null; // gak ada periode yang cukup jelas -> bukan nada tunggal yang bersih

    // Langkah 3b: koreksi oktaf -- DIHAPUS SEMENTARA (lihat Langkah 5 di bawah
    // untuk pendekatan penggantinya).
    // Tiga percobaan berturut-turut memperbaiki heuristik "cek subharmonik di
    // 2x tau" ini (mulai dari toleransi tetap, lalu toleransi mengikuti posisi
    // nada, lalu syarat "wajib lebih bersih") semuanya berakhir menimbulkan
    // masalah baru yang lebih parah daripada masalah asalnya (F2 kadang
    // kebaca F3). Root cause-nya baru ketemu: membandingkan nilai CMNDF antar
    // kandidat oktaf itu SENDIRI tidak bisa diandalkan untuk nada gitar asli --
    // gelombang petikan gitar sering tidak simetris sempurna per periode,
    // jadi CMNDF di frekuensi fundamental yang BENAR bisa saja terlihat lebih
    // "kotor" (lebih tinggi) dibanding di salah satu oktafnya, padahal
    // fundamental itu yang benar. Makanya pendekatan ini diganti total di
    // Langkah 5 dengan verifikasi energi spektral langsung, bukan cuma
    // re-membandingkan CMNDF. HARUS sinkron dengan yinDetect() di
    // NativeMicPitchDetector.java.

    // Langkah 4: interpolasi parabola di sekitar tauEstimate biar hasil frekuensinya presisi
    // (gak dibatasi kelipatan bulat sample, penting buat toleransi ala tuner).
    const x0 = tauEstimate>minTau ? tauEstimate-1 : tauEstimate;
    const x2 = tauEstimate<maxTau ? tauEstimate+1 : tauEstimate;
    let betterTau = tauEstimate;
    if(x0!==tauEstimate && x2!==tauEstimate){
      const s0=cmnd[x0], s1=cmnd[tauEstimate], s2=cmnd[x2];
      const denom = 2*(2*s1 - s2 - s0);
      if(denom) betterTau = tauEstimate + (s2 - s0)/denom;
    }
    if(betterTau<=0) return null;

    const rawFreq = sampleRate / betterTau;
    const probability = 1 - cmnd[tauEstimate]; // makin dekat 1 = makin yakin/periodik

    // Langkah 5: verifikasi oktaf lewat ENERGI SPEKTRAL LANGSUNG (algoritma
    // Goertzel -- cara ringan mengukur energi di satu frekuensi spesifik tanpa
    // perlu FFT penuh), menggantikan perbandingan CMNDF yang terbukti tidak
    // bisa diandalkan (lihat catatan Langkah 3b). Idenya: cek betulan apakah
    // ADA energi nyata di frekuensi hasil YIN itu sendiri, dibanding di
    // setengah/dua kali frekuensinya -- bukan cuma re-tebak dari bentuk CMNDF.
    //   - Kalau energi di SETENGAH frekuensi (satu oktaf di bawah) sudah
    //     sebanding dengan energi di frekuensi hasil YIN, itu tanda kuat
    //     "fundamental hilang/lemah" -- hasil YIN cuma harmonik ke-2 dari
    //     fundamental yang sebenarnya satu oktaf di bawah (kasus F2/F3).
    //   - Sebaliknya, kalau energi LANGSUNG di frekuensi hasil YIN itu sendiri
    //     sangat lemah dibanding di DUA KALI frekuensinya, hasil YIN kemungkinan
    //     cuma subharmonik semu (dampak trivial "periodik juga di 2x periode"),
    //     dan fundamental aslinya ada satu oktaf di ATAS (kasus G#3/A2).
    let finalFreq = rawFreq;
    const magAtFreq = goertzelMag(buf, rawFreq, sampleRate);
    const halfFreq = rawFreq/2;
    if(halfFreq >= MIN_VALID_FREQ){
      const magAtHalf = goertzelMag(buf, halfFreq, sampleRate);
      if(magAtHalf >= magAtFreq*0.6){
        finalFreq = halfFreq;
      }
    }
    // Arah "naik" (kalau energi di rawFreq lemah dibanding di 2x-nya, berarti
    // aslinya satu oktaf lebih tinggi -- buat kasus G#3/A2) DIHAPUS lagi di sini.
    // Senar BAWAH gitar (mis. E2) itu wajar punya harmonik ke-2 yang kuat
    // (apalagi lewat mic HP yang respons rendahnya lemah), jadi ciri "energi di
    // 2x jauh lebih kuat dari fundamentalnya" itu SERING muncul juga untuk nada
    // rendah yang sebenarnya sudah benar -- bukan cuma buat kasus subharmonik
    // semu. Akibatnya E2 yang tadinya benar malah ikut dikoreksi naik jadi E3.
    // Arah "turun" (halfFreq di atas) TIDAK kena masalah yang sama karena cuma
    // aktif kalau setengah frekuensinya masih valid, dan sudah teruji aman
    // untuk kasus F2/F3. HARUS sinkron dengan yinDetect() di
    // NativeMicPitchDetector.java.

    return { freq: finalFreq, clarity: probability };
  }

  /**
   * Algoritma Goertzel: hitung magnitudo energi sinyal di SATU frekuensi
   * target tertentu, tanpa perlu hitung FFT penuh atas semua frekuensi.
   * Dipakai di Langkah 5 yinDetect() buat verifikasi oktaf lewat energi
   * spektral langsung. HARUS sinkron dengan versi di NativeMicPitchDetector.java.
   */
  function goertzelMag(buf, targetFreq, sampleRate){
    const N = buf.length;
    const k = Math.round(N*targetFreq/sampleRate);
    const w = 2*Math.PI*k/N;
    const cosine = Math.cos(w), sine = Math.sin(w), coeff = 2*cosine;
    let q0=0, q1=0, q2=0;
    for(let n=0;n<N;n++){
      q0 = coeff*q1 - q2 + buf[n];
      q2=q1; q1=q0;
    }
    const real = q1 - q2*cosine;
    const imag = q2*sine;
    return Math.sqrt(real*real + imag*imag) / N;
  }


  // ---- Perbaikan "ketuker kategori" (angka<->huruf, angka<->tanda baca, dst) ----
  // Nada disusun kromatis berurutan (per setengah nada) dari terendah ke tertinggi:
  // baris angka (idx 0-9), lalu huruf/simbol (idx 10-19,20-28,30-36), tombol
  // fungsi (shift/backspace/toggle/enter), lalu tanda baca (idx 40-42). Karena
  // urutannya kontinu, batas antar kategori (mis. idx 9 ke idx 10) cuma
  // terpisah SATU setengah-nada -- kalau deteksi pitch meleset dikit persis di
  // batas itu, niat angka bisa kebaca sebagai huruf/tanda baca atau sebaliknya.
  function categoryOfIndex(idx){
    if(idx>=0 && idx<=9) return 'digit';
    if(idx===29 || idx===37 || idx===38 || idx===39 || idx===43) return 'functional';
    if(idx>=40 && idx<=42) return 'punct';
    return 'letterOrSymbol';
  }
  // Cek apakah sebuah bacaan frekuensi cukup AMAN buat langsung dikomit tanpa
  // risiko ketuker ke nada tetangga -- baik ketuker KATEGORI (angka jadi
  // huruf/tanda baca) MAUPUN ketuker nada tetangga SESAMA kategori (mis. G2
  // kebaca F#2, jadinya angka "3" padahal maunya "4"). Kalau bacaannya jelas
  // dekat pusat nada, aman langsung. Kalau posisinya di area pinggir/ambigu
  // antara dua nada tetangga, baru dikomit kalau bacaannya cukup meyakinkan --
  // makin dekat batas kategori berbeda, makin tinggi juga syarat keyakinannya.
  // Return-nya juga bawa centsOff (SELALU positif) -- dipakai micLoop() buat
  // menentukan requiredConfirm adaptif. HARUS sama persis dengan
  // isCategorySafe() di NativeMicPitchDetector.java.
  function isCategorySafe(freq, clarity){
    // Kalibrasi tuning diterapkan di sini: geser midiOffset sebesar offset
    // yang sudah dipelajari, SEBELUM dibulatkan ke fret/nada terdekat.
    const midiOffset = freqToMidi(freq) - BASE_MIDI - calibrationOffsetCents/100;
    const idx = Math.round(midiOffset);
    if(idx<0 || idx>=NOTE_COUNT) return {safe:false, idx, centsOff:100};
    const signedCentsOff = (midiOffset - idx) * 100;
    const centsOff = Math.abs(signedCentsOff); // 0..50
    let safe;
    if(centsOff < 25){
      // BARU: dulu langsung aman TANPA cek clarity kalau sudah dekat pusat
      // nada -- sekarang tetap perlu clarity minimal (asal-tidak-berisik),
      // walau jauh lebih longgar dibanding kasus di batas kategori.
      safe = clarity >= 0.5;
    } else {
      const neighborIdx = idx + (midiOffset >= idx ? 1 : -1);
      const differentCategory = !(neighborIdx>=0 && neighborIdx<NOTE_COUNT
          && categoryOfIndex(idx) === categoryOfIndex(neighborIdx));
      // Beda kategori (mis. angka/huruf) butuh keyakinan lebih tinggi lagi
      // daripada sekadar ketuker sesama angka, karena akibatnya lebih mengganggu.
      const requiredClarity = differentCategory ? 0.9 : 0.75;
      safe = clarity >= requiredClarity;
    }
    // BARU -- kalibrasi tuning: kalau bacaan ini SANGAT dekat pusat nada
    // (<15 cent) DAN dianggap aman, pelan-pelan geser referensi tuning ke arah
    // situ (EMA lambat, 5% per bacaan). Dibatasi +-45 cent.
    if(safe && centsOff < 15){
      calibrationOffsetCents = calibrationOffsetCents*0.95 + signedCentsOff*0.05;
      if(calibrationOffsetCents > 45) calibrationOffsetCents = 45;
      if(calibrationOffsetCents < -45) calibrationOffsetCents = -45;
    }
    return { safe, idx, centsOff };
  }

  function micLoop(){
    if(!listening) return;
    const buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
    const rms = Math.sqrt(sum/buf.length);
    const now = performance.now();

    if(state==='idle'){
      // Ambang absolut diturunkan dari 0.02 -> ONSET_RMS (0.012) supaya
      // petikan PELAN (fingerstyle, palm mute, senar atas yang tipis) tetap
      // memicu onset, bukan cuma petikan keras. Rasio ke smoothedRms
      // (noise-floor sekitar) tetap jadi penjaga utama supaya noise ruangan
      // yang konstan tidak ikut kepicu. HARUS sama persis dengan ONSET_RMS &
      // ONSET_RATIO di NativeMicPitchDetector.java.
      if(rms>ONSET_RMS && rms>smoothedRms*ONSET_RATIO && now>cooldownUntil){
        state='sampling';
        sampleTries=0;
        candidateIdx=-1; candidateCount=0;
        // Kasih jeda dikit dulu (~45ms) biar transien petikan gitar mereda dan
        // gelombangnya udah cukup stabil buat diukur. HARUS sama persis dengan
        // SETTLE_MS di NativeMicPitchDetector.java.
        sampleAt = now + 45;
        lastOnsetAt = now;
        onsetPeakRms = rms;
        showStatus('Mendengar petikan…');
      }
    } else if(state==='sampling'){
      // Terus perbarui puncak RMS sejak onset -- lihat catatan onsetPeakRms di
      // NativeMicPitchDetector.java (dilacak terus selama fase sampling, bukan
      // cuma dari satu frame pemicu onset saja).
      if(rms > onsetPeakRms) onsetPeakRms = rms;
      if(now>=sampleAt){
        const result = yinDetect(buf, micCtx.sampleRate);
        sampleTries++;
        // Seberapa besar sinyal sudah meluruh dari puncaknya -- lihat
        // TAP_DECAY_RATIO NativeMicPitchDetector.java buat penjelasan lengkap.
        const decayRatio = rms / onsetPeakRms;
        if(result){
          const chk = isCategorySafe(result.freq, result.clarity);
          // BARU: walau isCategorySafe() bilang "aman", kalau sinyalnya sudah
          // meluruh SANGAT cepat (ciri tap) DAN periodisitasnya tidak sampai
          // sangat meyakinkan, jangan percaya sebagai nada -- ini yang nangkep
          // kasus "tap kebaca jadi nada lain di atas". HARUS sama persis
          // dengan logika looksPercussive di NativeMicPitchDetector.java.
          const looksPercussive = decayRatio < TAP_DECAY_RATIO && result.clarity < STRONG_PROBABILITY;
          if(chk.safe && !looksPercussive){
            // Konsensus: cek apakah bacaan kali ini SEPAKAT sama kandidat
            // sebelumnya (idx sama). Kalau beda, kandidat direset ke bacaan
            // baru ini (mulai hitung dari 1 lagi) -- daripada asal kunci ke
            // bacaan pertama yang kebetulan lolos ambang tapi ternyata cuma
            // sekali muncul (fluktuasi sesaat).
            if(chk.idx === candidateIdx){
              candidateCount++;
            } else {
              candidateIdx = chk.idx;
              candidateCount = 1;
            }
            // requiredConfirm ADAPTIF -- HARUS sama persis dengan requiredConfirm
            // di NativeMicPitchDetector.java.
            const requiredConfirm = chk.centsOff < 12 ? 1 : (chk.centsOff < 22 ? 2 : 3);
            if(candidateCount >= requiredConfirm || sampleTries >= 4){
              // Sudah dapat cukup bacaan berturut yang sepakat (paling umum),
              // ATAU jatah percobaan sudah habis -- pakai bacaan TERAKHIR yang
              // lolos ini (lebih baik daripada nyerah total).
              commitDetectedNote(result.freq);
              state='releasing';
              cooldownUntil = now + COOLDOWN_MS;
              releaseWaitUntil = now + MAX_RELEASE_WAIT_MS;
            } else {
              // Belum cukup konsensus -- tunggu satu bacaan lagi buat konfirmasi
              // sebelum benar-benar dikunci.
              sampleAt = now + 10;
            }
          } else if(looksPercussive){
            // Meluruh sangat cepat & periodisitasnya tidak sampai sangat
            // meyakinkan -- ini tap, bukan nada. Langsung diputuskan sekarang
            // juga, tidak perlu tunggu jatah percobaan habis.
            typePercussiveTapAsSpace();
            state='releasing';
            cooldownUntil = now + COOLDOWN_MS;
            releaseWaitUntil = now + MAX_RELEASE_WAIT_MS;
          } else if(sampleTries < 4){
            // Bacaannya persis di batas dua kategori tuts berbeda (mis. angka vs
            // huruf/tanda baca) dan belum cukup yakin -- coba baca ulang dulu
            // daripada asal tebak dan salah kategori.
            sampleAt = now + 10;
          } else {
            showStatus('Nada di batas dua kategori tuts, coba petik lebih jelas.');
            state='releasing';
            cooldownUntil = now + COOLDOWN_MS;
            releaseWaitUntil = now + MAX_RELEASE_WAIT_MS;
          }
        } else if(sampleTries >= 4){
          // Beberapa frame berturut SAMA SEKALI tidak dapat sinyal periodik
          // (yinDetect() balikin null terus) walau tadinya cukup keras buat
          // memicu onset -- ini ciri khas TAP/ketukan ke badan gitar (bukan
          // senar dipetik). Beda dari kasus "ambigu di batas kategori" di atas
          // (yang MASIH dapat nada) -- di sini dianggap sengaja: ketik spasi.
          typePercussiveTapAsSpace();
          state='releasing';
          cooldownUntil = now + COOLDOWN_MS;
          releaseWaitUntil = now + MAX_RELEASE_WAIT_MS;
        } else {
          sampleAt = now + 10; // masih terlalu transien -- coba baca lagi di frame berikutnya
        }
      }
    } else if(state==='releasing'){
      // Cari titik paling pelan dari RETRIGGER_WINDOW_HOPS frame terakhir --
      // "lembah" ini harus benar-benar dilewati dulu sebelum sebuah lonjakan
      // dianggap onset baru, bukan cuma riak/beating dalam petikan yang sama.
      let recentMin = recentHopRms[0];
      for(let i=1;i<recentHopRms.length;i++){ if(recentHopRms[i]<recentMin) recentMin = recentHopRms[i]; }

      // BARU: retrigger -- kalau ada lonjakan RMS baru yang jelas (nada baru
      // menimpa ekor dengungan nada sebelumnya, khas teknik tapping/petik
      // cepat) DAN memang ada lembah beneran sebelum lonjakan ini DAN sudah
      // lewat jarak minimum mutlak dari onset terakhir, langsung anggap onset
      // baru. Tiga syarat ini sengaja dipisah supaya beating/riak dari SATU
      // strum yang sama tidak kehitung berkali-kali sebagai huruf berbeda-beda.
      // HARUS sama persis dengan logika retrigger di NativeMicPitchDetector.java.
      if(now>cooldownUntil && now-lastOnsetAt>MIN_RETRIGGER_GAP_MS
          && rms>RETRIGGER_MIN_RMS && rms>recentMin*RETRIGGER_RATIO){
        state='sampling';
        sampleTries=0;
        candidateIdx=-1; candidateCount=0;
        sampleAt = now + 45;
        lastOnsetAt = now;
        onsetPeakRms = rms;
        releaseBelowCount = 0;
        showStatus('Mendengar petikan…');
      } else if(now>cooldownUntil && now>releaseWaitUntil){
        // Jaring pengaman: sudah kelamaan nunggu -- paksa balik ke idle walau
        // belum benar-benar hening, daripada macet permanen.
        state='idle';
        releaseBelowCount = 0;
      } else if(rms<RELEASE_RMS){
        // Baru boleh siap deteksi onset baru lagi (jalur normal) kalau RMS
        // sudah di bawah RELEASE_RMS SELAMA RELEASE_CONFIRM_HOPS frame
        // BERTURUT-TURUT -- bukan cuma sekali nyentuh di bawah ambang, supaya
        // riak sesaat di tengah dengungan yang masih jelas terdengar tidak
        // dikira "sudah reda".
        releaseBelowCount++;
        if(releaseBelowCount >= RELEASE_CONFIRM_HOPS && now>cooldownUntil){
          state='idle';
          releaseBelowCount = 0;
        }
      } else {
        releaseBelowCount = 0;
      }
    }
    recentHopRms[recentHopIdx] = rms;
    recentHopIdx = (recentHopIdx + 1) % recentHopRms.length;
    smoothedRms = smoothedRms*0.85 + rms*0.15;
    rafId = requestAnimationFrame(micLoop);
  }

  async function startMic(){
    if(hasNativeMicBridge()){
      const ok = window.AndroidKeyboard.startNativeMic();
      if(ok){
        listening = true;
        micToolBtn.classList.add('on');
      }
      return;
    }

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showStatus('❌ navigator.mediaDevices tidak tersedia. Kamu tetap bisa ketuk tuts manual.');
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
      });
    }catch(err){
      const detail = (err && err.name) ? (err.name + (err.message ? ': ' + err.message : '')) : String(err);
      showStatus('❌ Gagal akses mikrofon → ' + detail + '. Kamu tetap bisa ketuk tuts manual.');
      return;
    }
    micCtx = new (window.AudioContext||window.webkitAudioContext)();
    const src = micCtx.createMediaStreamSource(stream);
    analyser = micCtx.createAnalyser();
    analyser.fftSize = 4096;
    src.connect(analyser);
    listening = true;
    document.getElementById('micToolBtn').classList.add('on');
    showStatus('Mendengarkan… petik satu nada per satu.');
    micLoop();
  }
  function stopMic(){
    listening=false;
    if(hasNativeMicBridge()){
      window.AndroidKeyboard.stopNativeMic();
    }
    if(rafId) cancelAnimationFrame(rafId);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(micCtx) micCtx.close();
    document.getElementById('micToolBtn').classList.remove('on');
    showStatus('Mikrofon dijeda. Ketuk ikon mic untuk mendengarkan lagi.');
  }
  const micToolBtn = document.getElementById('micToolBtn');
  // userPausedMic: kalau pengguna sendiri mematikan mic lewat tombol, jangan
  // dihidupkan lagi otomatis saat keyboard muncul kembali.
  let userPausedMic = false;
  micToolBtn.addEventListener('click', ()=>{
    if(listening){ userPausedMic = true;  stopMic(); }
    else         { userPausedMic = false; startMic(); }
  });
  // Dipanggil dari HtmlKeyboardService.onWindowHidden()/onWindowShown().
  // Mic HARUS mati saat keyboard tidak terlihat (privasi + baterai), dan
  // hidup lagi otomatis begitu keyboard muncul (kecuali dijeda manual).
  window.onKeyboardHidden = function(){ if(listening) stopMic(); };
  window.onKeyboardShown  = function(){ if(!listening && !userPausedMic) startMic(); };

  window.addEventListener('keydown', (e)=>{
    const key = keyMap[e.key.toLowerCase()];
    if(!key) return;
    e.preventDefault();
    if(key.dataset.type==='note') manualPress(key);
    else if(key.id==='shiftBtn') shiftToggle(key);
    else functionalPress(key);

    });

  // ---------------- Inisialisasi & wiring fitur baru ----------------
  // BARU: satu slot (.feature-bar), dua isi yang gantian tampil -- baris ikon
  // fitur (.gboard-toolbar) ATAU saran kata/status (.suggest-bar), tidak
  // pernah dua-duanya sekaligus. showFeatureBarMode('suggest') dipanggil lagi
  // dari renderSuggestions()/showStatus() supaya begitu ada ketikan atau nada
  // kedeteksi, tampilan otomatis balik nampilin itu walau tadinya lagi buka
  // baris ikon fitur -- persis Gboard, umpan balik penting selalu menang.
  // PENTING: blok ini HARUS dideklarasikan SEBELUM applyLang(currentLang) di
  // bawah dipanggil -- applyLang() memicu renderSuggestions() yang langsung
  // memanggil showFeatureBarMode(), jadi kalau gboardToolbarEl/suggestBarEl/
  // featureToggleBtn belum sempat dideklarasikan (const punya "temporal dead
  // zone"), halaman langsung crash total kena ReferenceError sejak awal load.
  const gboardToolbarEl = document.getElementById('gboardToolbar');
  const suggestBarEl = document.getElementById('suggestBar');
  const featureToggleBtn = document.getElementById('featureToggleBtn');
  // Semua panel yang menggantikan area tuts, beserta jenis display-nya saat terbuka.
  const PANEL_DISPLAY = { toolPanel:'block', settingsPanel:'block', clipboardPanel:'flex', gifPanel:'flex', translatePanel:'flex', langPanel:'flex' };
  let lastKbHeight = 0;
  var toolEditing = false;   // mode pensil (sesuaikan item kisi alat)
  function panelEl(id){ return document.getElementById(id); }
  function anyPanelOpen(){
    return Object.keys(PANEL_DISPLAY).some(id => { const el = panelEl(id); return el && el.style.display && el.style.display !== 'none'; });
  }
  // Ikon kiri: grid saat normal, X saat ada panel / baris alat yang terbuka (persis Gboard).
  function syncLeftIcon(){
    featureToggleBtn.classList.toggle('is-close', anyPanelOpen() || gboardToolbarEl.style.display !== 'none');
  }
  function hideLangPopup(){ const p = panelEl('langPopup'); if(p) p.style.display = 'none'; }
  function closePanelsOnly(){
    Object.keys(PANEL_DISPLAY).forEach(id => { const p = panelEl(id); p.style.display = 'none'; p.style.minHeight = ''; });
    const kb = panelEl('keyboardInner'); if(kb) kb.style.display = '';
    document.querySelectorAll('.gtool-btn').forEach(b => b.classList.remove('tool-active'));
    hideLangPopup();
    if(toolEditing && typeof setToolEditing === 'function') setToolEditing(false);   // keluar dari mode pensil
  }
  // Buka satu panel. Panel setinggi tuts yang digantikannya supaya keyboard tidak "meloncat" naik-turun.
  function openPanel(id, keepKeyboard, activeBtn){
    const kb = panelEl('keyboardInner');
    const kh = kb.offsetHeight; if(kh > 0) lastKbHeight = kh;
    closePanelsOnly();
    const p = panelEl(id);
    p.style.display = PANEL_DISPLAY[id];
    if(!keepKeyboard){ kb.style.display = 'none'; if(lastKbHeight) p.style.minHeight = lastKbHeight + 'px'; }
    if(activeBtn) activeBtn.classList.add('tool-active');
    syncLeftIcon();
  }
  // BARU: satu slot bar, dua isi yang gantian -- saran kata/status ATAU baris ikon alat (yang juga
  // membuka kisi alat di area tuts). showFeatureBarMode('suggest') dipanggil lagi dari
  // renderSuggestions()/showStatus() supaya umpan balik penting (ketikan, nada terdeteksi) selalu menang.
  // PENTING: fungsi ini sudah dipanggil sejak applyLang() di awal, jadi jangan menyentuh const
  // yang dideklarasikan di bawahnya -- semua elemen dicari lewat getElementById saat dipanggil.
  function showFeatureBarMode(mode){
    if(mode === 'tools'){
      gboardToolbarEl.style.display = 'flex';
      suggestBarEl.style.display = 'none';
      openPanel('toolPanel', false, null);
    } else {
      gboardToolbarEl.style.display = 'none';
      suggestBarEl.style.display = 'flex';
      if(panelEl('toolPanel').style.display === 'block') closePanelsOnly();
    }
    syncLeftIcon();
  }
  function closeEverything(){ closePanelsOnly(); showFeatureBarMode('suggest'); }
  featureToggleBtn.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    if(anyPanelOpen() || gboardToolbarEl.style.display !== 'none') closeEverything();
    else showFeatureBarMode('tools');

  const fontScaleRange = document.getElementById('fontScaleRange');
  if(fontScaleRange){
    fontScaleRange.addEventListener('input', (e)=> applyFontScale(parseInt(e.target.value, 10)));
  }

  // ---------------- Toolbar fitur: tinggi ~10–12% dari total tinggi keyboard,
  // sesuai rasio Gboard asli. Dihitung ulang tiap kali ukuran kbWrap berubah
  // (rotasi layar, buka/tutup panel emoji, dsb) supaya rasionya tetap konsisten. ----------------
  function sizeToolbarToRatio(){
    const wrap = document.getElementById('kbWrap');
    // BARU: yang dikunci tingginya sekarang #featureBar (wadah bersama), bukan
    // #gboardToolbar saja -- supaya baik lagi nampilin ikon fitur MAUPUN saran
    // kata/status, tinggi slotnya tetap sama persis (lihat CSS .feature-bar).
    const bar = document.getElementById('featureBar');
    if(!wrap || !bar) return;
    const totalH = wrap.getBoundingClientRect().height;
    if(totalH <= 0) return;
    const target = Math.max(44, Math.min(56, totalH * 0.11)); // ~11% dari tinggi total, dibatasi 44–56px
    bar.style.setProperty('--toolbar-h', target + 'px');
    bar.style.height = target + 'px';
  }
  if('ResizeObserver' in window){
    new ResizeObserver(sizeToolbarToRatio).observe(kbWrap);
  } else {
    window.addEventListener('resize', sizeToolbarToRatio);
  }
  sizeToolbarToRatio();

  document.getElementById('themeSwatches').addEventListener('pointerdown', (e)=>{
    const sw = e.target.closest('.theme-swatch');
    if(sw) applyTheme(sw.dataset.theme);
  });

  const settingsBtn = document.getElementById('settingsBtn');
  const themeBtn = document.getElementById('themeBtn');
  const sizeBtn = document.getElementById('sizeBtn');
  const clipboardBtn = document.getElementById('clipboardBtn');
  const gifBtn = document.getElementById('gifBtn');
  const translateBtn = document.getElementById('translateBtn');
  const langBtn = document.getElementById('langBtn');
  const emojiToolBtn = document.getElementById('emojiToolBtn');
  const noteTagBtn = document.getElementById('noteTagBtn');
  const settingsPanel = panelEl('settingsPanel');
  const langPanelEl = panelEl('langPanel');
  const langPopupEl = panelEl('langPopup');

  // Ketuk ikon yang sama lagi = kembali ke kisi alat. Baris ikon tetap tampil selama panelnya terbuka.
  function togglePanel(id, btn, prep, keepKeyboard){
    const cur = panelEl(id).style.display;
    if(cur && cur !== 'none'){ showFeatureBarMode('tools'); return; }
    if(prep) prep();
    gboardToolbarEl.style.display = 'flex';
    suggestBarEl.style.display = 'none';
    openPanel(id, keepKeyboard, btn);
  }
  settingsBtn.addEventListener('click', ()=> togglePanel('settingsPanel', settingsBtn, ()=>{ settingsPanel.dataset.filter = 'all'; }));
  themeBtn.addEventListener('click',    ()=> togglePanel('settingsPanel', themeBtn,    ()=>{ settingsPanel.dataset.filter = 'theme'; }));
  sizeBtn.addEventListener('click',     ()=> togglePanel('settingsPanel', null,        ()=>{ settingsPanel.dataset.filter = 'size'; }));
  clipboardBtn.addEventListener('click', ()=> togglePanel('clipboardPanel', null, renderClipboardPanel));
  gifBtn.addEventListener('click',       ()=> togglePanel('gifPanel', gifBtn, renderGifPanel));
  translateBtn.addEventListener('click', ()=>{
    // Mode terjemah tetap menampilkan tuts (bukan cuma panel) supaya bisa langsung mengetik / memetik nada.
    togglePanel('translatePanel', translateBtn, null, true);
    updateTranslatePreview();
  });
  langBtn.addEventListener('click', ()=> togglePanel('langPanel', null, renderLangPanel));
  emojiToolBtn.addEventListener('click', ()=>{ closeEverything(); setMode('emoji'); });
  document.getElementById('oneHandBtn').addEventListener('click', ()=>{ toggleOneHand(); closeEverything(); });


  // ---- Kisi alat: titik halaman, tombol pensil (sembunyikan/tampilkan item), pilihan koreksi, bagikan ----
  const toolPages = document.getElementById('toolPages');
  const toolDots = document.querySelectorAll('#toolDots i');
  toolPages.addEventListener('scroll', ()=>{
    const i = Math.round(toolPages.scrollLeft / Math.max(1, toolPages.clientWidth));
    toolDots.forEach((d, k) => d.classList.toggle('on', k === i));
  }, { passive:true });

  const HIDDEN_KEY = 'genjreng_toolhidden_v1';
  let hiddenTools = [];
  try{ const s = JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]'); if(Array.isArray(s)) hiddenTools = s; }catch(e){}
  function applyHiddenTools(){
    document.querySelectorAll('[data-tool]').forEach(el => el.classList.toggle('tool-hidden', hiddenTools.includes(el.dataset.tool)));
  }
  applyHiddenTools();
  const toolEditBtn = document.getElementById('toolEditBtn');
  function setToolEditing(on){
    toolEditing = !!on;
    panelEl('toolPanel').classList.toggle('editing', toolEditing);
    gboardToolbarEl.classList.toggle('editing', toolEditing);
    toolEditBtn.innerHTML = ICONS[toolEditing ? 'check' : 'pencil'];
    document.getElementById('toolHint').textContent = toolEditing ? 'Ketuk item: sembunyi/tampil' : '';
  }
  toolEditBtn.addEventListener('click', ()=> setToolEditing(!toolEditing));
  // Saat mode sesuaikan, ketukan pada item = sembunyikan/tampilkan, BUKAN menjalankan fungsinya (fase capture).
  [panelEl('toolPanel'), gboardToolbarEl].forEach(el => el.addEventListener('click', (e)=>{
    if(!toolEditing) return;
    const t = e.target.closest('[data-tool]');
    if(!t) return;
    e.stopPropagation(); e.preventDefault();
    const k = t.dataset.tool;
    hiddenTools = hiddenTools.includes(k) ? hiddenTools.filter(x => x !== k) : hiddenTools.concat(k);
    try{ localStorage.setItem(HIDDEN_KEY, JSON.stringify(hiddenTools)); }catch(err){}
    applyHiddenTools();
  }, true));

  const autoCorrectBtn = document.getElementById('autoCorrectBtn');
  const autoCapsBtn = document.getElementById('autoCapsBtn');
  const suggestBtn = document.getElementById('suggestBtn');
  function syncPrefPills(){
    autoCorrectBtn.classList.toggle('on', prefs.autocorrect);
    autoCapsBtn.classList.toggle('on', prefs.autocaps);
    suggestBtn.classList.toggle('on', prefs.suggest);
  }
  syncPrefPills();
  autoCorrectBtn.addEventListener('click', ()=>{ prefs.autocorrect = !prefs.autocorrect; savePrefs(); syncPrefPills(); });
  autoCapsBtn.addEventListener('click', ()=>{ prefs.autocaps = !prefs.autocaps; savePrefs(); syncPrefPills(); if(!prefs.autocaps) applyAutoCaps(false); });
  suggestBtn.addEventListener('click', ()=>{ prefs.suggest = !prefs.suggest; savePrefs(); syncPrefPills(); });
  document.getElementById('settingsPill').addEventListener('click', ()=> togglePanel('settingsPanel', null, ()=>{ settingsPanel.dataset.filter = 'all'; }));

  // Teks yang dibagikan lewat tombol "Bagikan". Ganti sesuai keinginan (mis. tambahkan tautan repo GitHub).
  const SHARE_TEXT = 'Guitarwiter — keyboard Android yang mengubah petikan gitar jadi ketikan otomatis.';
  document.getElementById('shareBtn').addEventListener('click', ()=>{
    try{
      if(window.AndroidKeyboard && window.AndroidKeyboard.shareText){ window.AndroidKeyboard.shareText(SHARE_TEXT); return; }
      if(navigator.share) navigator.share({ text: SHARE_TEXT });
    }catch(e){}
  });
  // Hapus kamus pribadi: ketuk dua kali (yang kedua dalam 3 detik) supaya tidak kehapus tidak sengaja.
  const resetDictBtn = document.getElementById('resetDictBtn');
  let resetArmed = null;
  resetDictBtn.addEventListener('click', ()=>{
    const lbl = resetDictBtn.querySelector('.lbl');
    if(!resetArmed){
      lbl.textContent = 'Ketuk lagi';
      resetDictBtn.classList.add('on');
      resetArmed = setTimeout(()=>{ resetArmed = null; lbl.textContent = 'Reset kamus'; resetDictBtn.classList.remove('on'); }, 3000);
      return;
    }
    clearTimeout(resetArmed); resetArmed = null;
    learnedWords = {}; bigrams = {};
    learnedWords[currentLang] = {}; bigrams[currentLang] = {};
    lastCompletedWord = '';
    blocked = {};
    try{ localStorage.removeItem(LEARN_KEY); localStorage.removeItem(BIGRAM_KEY); localStorage.removeItem(BLOCK_KEY); }catch(e){}
    lbl.textContent = 'Terhapus ✓';
    setTimeout(()=>{ lbl.textContent = 'Reset kamus'; resetDictBtn.classList.remove('on'); }, 1500);
  });

  // ---- Label nada di tuts: bisa disembunyikan supaya tuts sebersih Gboard ----
  function applyTags(show){
    document.body.classList.toggle('hide-tags', !show);
    noteTagBtn.classList.toggle('on', show);
    try{ localStorage.setItem('genjreng_tags', show ? '1' : '0'); }catch(e){}
  }
  noteTagBtn.addEventListener('click', ()=> applyTags(document.body.classList.contains('hide-tags')));
  (function(){ let s = '1'; try{ s = localStorage.getItem('genjreng_tags') || '1'; }catch(e){} applyTags(s !== '0'); })();

  // ---- Pilihan bahasa: panel kelola (kisi alat -> Bahasa) + popup cepat (tahan spasi), seperti Gboard ----
  function renderLangPanel(){
    langPanelEl.innerHTML = '';
    const head = document.createElement('h4');
    head.textContent = 'Ketuk untuk memakai · centang = masuk pilihan cepat (tahan spasi). Bahasa non-Latin: ketik huruf latin, otomatis jadi hurufnya.';
    langPanelEl.appendChild(head);
    Object.keys(LANGS).forEach(code => {
      const row = document.createElement('div');
      row.className = 'lang-row';
      const pick = document.createElement('button');
      pick.type = 'button';
      pick.className = 'lang-pick' + (code === currentLang ? ' active' : '');
      pick.innerHTML = '<span class="lp-txt"><span>' + LANGS[code].name + '</span>' + (LANGS[code].hint ? '<small>' + LANGS[code].hint + '</small>' : '') + '</span><span class="lang-tag">' + LANGS[code].tag + '</span>';
      pick.addEventListener('click', ()=>{
        if(!enabledLangs.includes(code)) setEnabledLangs([...enabledLangs, code]);
        applyLang(code);
        closeEverything();
      });
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = enabledLangs.includes(code);
      cb.title = 'Tampilkan di pilihan cepat';
      cb.addEventListener('change', ()=>{
        const list = cb.checked ? [...enabledLangs, code] : enabledLangs.filter(c => c !== code);
        if(!list.length){ cb.checked = true; return; }   // minimal satu bahasa harus aktif
        setEnabledLangs(list);
        renderLangPanel();
      });
      row.appendChild(pick); row.appendChild(cb);
      langPanelEl.appendChild(row);
    });
  }
  function showLangPopup(){
    langPopupEl.innerHTML = '';
    enabledLangs.forEach(code => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'lang-item' + (code === currentLang ? ' active' : '');
      b.innerHTML = '<span>' + LANGS[code].name + '</span><span class="lang-tag">' + LANGS[code].tag + '</span>';
      b.addEventListener('click', ()=>{ applyLang(code); hideLangPopup(); });
      langPopupEl.appendChild(b);
    });
    const m = document.createElement('button');
    m.type = 'button';
    m.className = 'lang-item manage';
    m.innerHTML = ICONS.globe + '<span>Kelola bahasa…</span>';
    m.addEventListener('click', ()=>{ hideLangPopup(); gboardToolbarEl.style.display = 'flex'; suggestBarEl.style.display = 'none'; renderLangPanel(); openPanel('langPanel', false, null); });
    langPopupEl.appendChild(m);
    langPopupEl.style.display = 'block';
    // Jangan sampai popup lebih tinggi dari area keyboard (WebView keyboard terpotong di tepinya).
    langPopupEl.style.maxHeight = Math.max(90, kbWrap.clientHeight - 62) + 'px';
  }
  // Tahan spasi ±0,45 dtk -> popup bahasa. Spasi sudah terketik saat jari menyentuh (biar ketikan
  // tetap instan), jadi kalau jadi tahan, spasi itu dihapus lagi.
  (function(){
    const sp = allKeys.find(el => el && el.dataset && el.dataset.type === 'literal' && el.dataset.char === ' ');
    if(!sp) return;
    let t = null, sx = 0, sy = 0;
    const clear = ()=>{ if(t){ clearTimeout(t); t = null; } };
    sp.addEventListener('pointerdown', (e)=>{
      sx = e.clientX; sy = e.clientY; clear();
      t = setTimeout(()=>{ t = null; backspace(); showLangPopup(); if(navigator.vibrate) navigator.vibrate(10); }, 450);
    });
    sp.addEventListener('pointermove', (e)=>{ if(t && (Math.abs(e.clientX-sx) > 18 || Math.abs(e.clientY-sy) > 18)) clear(); });
    ['pointerup','pointercancel','pointerleave'].forEach(ev => sp.addEventListener(ev, clear));
  })();
  document.addEventListener('pointerdown', (e)=>{
    if(langPopupEl.style.display === 'block' && !langPopupEl.contains(e.target)) hideLangPopup();
  }, true);

  document.getElementById('translateSwap').addEventListener('click', ()=>{
    const from = document.getElementById('translateFrom');
    const to = document.getElementById('translateTo');
    const tmp = from.value; from.value = to.value; to.value = tmp;
    updateTranslatePreview();
  });
  document.getElementById('translateFrom').addEventListener('change', updateTranslatePreview);
  document.getElementById('translateTo').addEventListener('change', updateTranslatePreview);
  document.getElementById('translateInsert').addEventListener('click', ()=>{
    const from = document.getElementById('translateFrom').value;
    const to = document.getElementById('translateTo').value;
    if(!text.trim()) return;
    const result = translateText(text, from, to);
    bridgeCommit(' → ' + result);
    text = text + ' → ' + result;
    cursorPos = text.length;
    showStatus('Terjemahan disisipkan.');
  });

  document.getElementById('oneHandFlip').addEventListener('click', toggleOneHand);

  // ---------------- Mic langsung otomatis mendengarkan, tanpa perlu tombol ----------------
  // Di keyboard Android asli, izin mikrofon SUDAH dikabulkan sekali lewat
  // MainActivity saat aplikasi pertama dibuka — jadi getUserMedia() di sini
  // tidak akan memunculkan pop-up apa pun, dan mic langsung aktif diam-diam
  // begitu keyboard muncul. (Kalau dibuka di browser biasa untuk uji coba,
  // browser tetap akan menampilkan pop-up izin sekali, karena itu aturan
  // keamanan bawaan browser yang tidak bisa dilewati dari sisi halaman web.)
  startMic();
})();
</script>
</body>
</html>
